[project]
name = "vibe"
version = "0.1.0"
description = "A local TUI coding agent built on a minimal agent harness"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["ddgs==9.16.0", "fastmcp==4.1.1", "httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]
eval = ["swebench==4.1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
