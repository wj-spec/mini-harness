<script type="application/json" id="sdflow-docs">[{"label":"roadmap","path":"openspec/roadmaps/build-agent-lab/roadmap.md","text":"# Agent 实验台实施路线图\n\n\u003e 版本：v2，2026-11-08。状态：规划方案已复核；P1–P7 均未实施。\n\u003e\n\u003e [整体设计](design.md) · [任务与评审记录](task-log.md)\n\n## 概览\n\n推荐顺序：**可信运行证据 → SWE-bench 对照 → Terminal-Bench 对照 → 真实失败转回归 → 本地阅读工作台 → 基线与门禁 → 可选观测集成**。\n这条路线服务于当前 coding 可靠性、W0 可复现起点和已有评测扩题，不新增 W0–W7 的已完成声明，也不替代正在推进的 Ink UX 切片。\n\n**近期只细化 P1/P2**：P1 能独立解释一次任务，P2 以 SWE-bench 为首个主基准比较一次改动，复用已有 Harbor 与官方评分链路。Terminal-Bench 是紧随其后的必需阶段，不属于可选扩展。案例提取、Web 信息架构、门禁阈值需要前两阶段的真实数据才能细化。每阶段一个内聚结果，先验收再推进；没有投入时长基线，不承诺日历日期。\n\n| 阶段 | 独立结果 | 对应需求 | 状态 |\n|---|---|---|---|\n| P1 运行证据包 | 实际运行身份与证据可查询、可验证、可解释缺失 | R1/R2 | 五节细化，待实施规格 |\n| P2 SWE-bench 对照 | 固定 Verified 题集和官方 grader 比较两个候选 | R3/R8 | 五节细化，依赖 P1 |\n| P3 Terminal-Bench 对照 | 固定版本的 Harbor 任务/试次、原生评分与对照 | R3/R8 | 必需阶段，目标与补细条件 |\n| P4 失败转回归 | 一个真实失败变成可维护案例与新题集版本 | R4 | 目标与补细条件 |\n| P5 本地实验工作台 | 运行、对比、案例和实验可以交互阅读 | R6 | 目标与补细条件 |\n| P6 基线与回归门禁 | 采用决定有证据、回归可定位、旧基线可恢复 | R5 | 目标与补细条件 |\n| P7 可选观测集成 | 按实际需要增加观测后端与其他评测适配 | R7 | 可选方向 |\n\n## P1 · 可信运行证据包\n\n**原型反馈输入（待纳入实施规格）**：用户优先诊断真实任务的失败、反复和高消耗，见 [业务旅程](business-workflows.md)。\nP1 的证据包与只读查看应先验一条“任务结果 → 请求/工具/上下文 → 诊断依据”的真实路径；重点核对 task/segment/run/request 的显式关联，分别表达完整正文、内容指纹、估算占用与实际 usage。\n诊断主路径已用历史产物做离线原型，但不替代生产采集验收；本增量不把正式 Web 提前列为 P1 交付。\n\n### 前置条件\n\n- [ ] 核查当前工作树与运行入口；保存已有未提交工作的身份，不混入本阶段改动。\n- [ ] P1 change 冻结证据 schema、生产端与消费者兼容夹具、实际源码/配置的快照边界。\n- [ ] 测量固定 10 万事件夹具的读取基线，在实现前锁定耗时、内存与采集开销门槛。\n- [ ] 明确每个写入/快照操作的现有 Gate 或内部存储授权路径；新增执行能力不得绕过 ApprovalGate。\n\n### 目标\n\n对一个 Ink/stdio 日常任务导出可核查证据包，通过只读命令或报告查看实际运行身份、动作、最终验证与缺失材料。\n完整记录能辨别不同脏工作树；历史记录不反推不存在的版本信息。（见 [design.md 决策 2](design.md#决策-2事实索引判断分别保存)、[决策 3](design.md#决策-3版本身份与可复现程度分别表达)、[决策 4](design.md#决策-4证据包有明确完整性与导入语义)）\n\n### 子任务\n\n- [ ] **一个完整 change：运行证据包的生成、校验与只读查看**。\n  包含 run 启动身份、原始事件与轮次证据引用、结果完整性、导入幂等及 legacy 缺失说明。\n  先覆盖 stdio 日常入口和对应 fake 集成夹具；其他入口标明未覆盖，不承诺所有历史数据可重建。\n  不在本阶段增加 Web 控制面、真实模型批量运行或网络导出。\n\n### 验收标准\n\n- [ ] 同一 HEAD、不同有效 tracked/untracked 内容产生不同身份；执行者与目标仓库分别显示。\n- [ ] 新任务可定位起始身份、工具/审批/验证与终态；一段恢复任务关联多 run，总量不重复计费。\n- [ ] 可重建材料和仅有指纹明确区分；运行中实现漂移、缺指令正文分别显示原因。\n- [ ] 同包导入两次计数不变；同 ID 异内容拒绝覆盖；断行/轮转/无终态/缺 artifact 不伪造完成。\n- [ ] 路径穿越与符号链接逃逸被拒绝；查看证据不执行命令、不调用模型、不发网络请求。\n- [ ] 采集失败不影响既有 Agent 结果、审批决定及 stdout 协议；显式导出失败有结构化错误。\n- [ ] 固定性能夹具满足实施前锁定的门槛；关闭新增能力可回到既有行为。\n- [ ] 行为测试先红后绿；全量 `./run_tests.sh -q`、适用 fake smoke 与文档检查有真实记录；Owner 按协作协议复核一个正常例和一个缺失例。\n\n### 交付物\n\n生产端证据协议、导出/校验/只读查看入口、兼容夹具、测试证据、限制清单与使用说明。\n建议 change：`implement-build-agent-lab-p1`；本规划没有创建该 change，也未实现上述入口。\n\n## P2 · SWE-bench 版本对照\n\n### 前置条件\n\n- [ ] P1 完成自动验证与相应人工 review，证据身份及完整性合同可用。\n- [ ] 确定 SWE-bench variant（建议 Verified）、官方 dataset revision、预定 instance 清单和 split；小集合不得冒充全量。\n- [ ] 核对现有 bench adapter、补丁收集、评分脚本和 CLI 入口在当前源码布局下可运行；锁定 Harbor、官方 swebench、镜像架构与 adapter 版本，不凭旧文档假定兼容。\n- [ ] 明确从物化候选快照启动 Agent 的方法；独立固定版本的官方 grader 不随 A/B 候选变化；oracle preflight 与 Agent 输入隔离。\n- [ ] 冻结原始/送评 patch 转换、缺预测、空预测、多次尝试、评分错误、分母、运行顺序和成本规则。\n- [ ] 付费实验启动前确认模型、题数、重复次数和总预算；离线报告夹具可先验证，真实容器与模型结果另记。\n\n### 目标\n\n在固定 SWE-bench 题集与官方评分条件下比较两个 Agent 候选，逐题呈现 resolved、原生评分来源、过程证据及成本差异。\n内部 eval 保留为快速自检，不替代主基准验收。（见 [design.md 决策 5](design.md#决策-5结果正确性由版本化独立评分决定)、[决策 6](design.md#决策-6对照实验先声明可比条件)、[决策 9](design.md#决策-9两个主基准复用原生执行与评分实验台管理证据和比较)）\n\n### 子任务\n\n- [ ] **一个完整 change：SWE-bench 实验从候选执行到官方评分的可比报告**。\n  复用 Harbor 安装型 Agent、预测收集与官方 grader；补齐 profile、job/trial/run 映射、原始产物链、全部 attempt 及可比性验证。\n  现有容器/评分链的必要适配属于该交付，不重写评分器；本阶段不增加 Terminal-Bench 专用规则或自动发布。\n\n### 验收标准\n\n- [ ] 固定报告夹具的改善/退步按 instance 正确展示；Agent 候选确实来自指定快照，用户随后修改原工作树不改变该实验。\n- [ ] dataset/task 清单、镜像/环境、官方 grader、预算或 patch 转换发生非允许变化时给出 incomparable 原因。\n- [ ] Harbor reward 与官方 grader resolved 分栏，二者冲突显示 score_disagreement；原生分数不能被实验台有效样本统计覆盖。\n- [ ] 原始 patch 与送评 patch 都可校验；空/缺预测仍在清单中；新文件或转换遗漏不会静默丢弃；重复 instance 关联独立 attempt，不覆盖或挑最好一次。\n- [ ] done 但独立检查失败判 fail；预算暂停不算通过；候选引起的构建/依赖/产物执行失败为 fail，评分设施故障为 invalid；故障归属不明时不作改善或采用结论。\n- [ ] 缺题/无效结果保留预定分母与配对覆盖；候选让困难题变 invalid 不得显示总体改善；oracle 失败不能删题后宣称全量。\n- [ ] 无价格时费用显示 unknown；重试、续做和失败成本保留；预算不足不启动新 attempt；容器授权仍经 ApprovalGate。\n- [ ] 报告数值可追到官方 report 与原始日志；同包重复导入幂等；查询报告不运行 patch 或命令。\n- [ ] 全量项目测试及离线集成通过；按授权预算完成至少一个固定小集合的真实容器/模型/官方评分对照，明确是 local_subset。尚未运行时只能标记工程验证通过。\n- [ ] Owner 能指出实验变量、原生分母、一个失败及一个不可比原因；未获官方接纳时不得显示 accepted 或官方排名。\n\n### 交付物\n\n版本化 BenchmarkProfile、SWE-bench adapter/入口、原始与送评预测、官方评分报告、逐题对照及全部证据。\n建议 change：`implement-build-agent-lab-p2`。完整 Verified 批次按预算另行运行，不是小集合验收的默认副作用。\n\n## P3 · Terminal-Bench 版本对照\n\n**阶段目标**：复用 Harbor 运行固定 Terminal-Bench 版本，将任务、trial、原生 verifier reward、轨迹、异常与成本完整关联到候选版本，并按该版本协议比较结果；这是第二个必需主基准。\n\n**补细条件**：需要用户确定主版本与精确数据 revision、对应 Harbor 兼容性、资源/超时和重复试次要求，以及 P2 的共用证据映射反馈；随后写满前置、任务与验收，不预写未核实的 CLI 参数。小集合与全量分开，真实成本授权和正式上榜审核分别处理。\n\n## P4 · 真实失败转回归\n\n**阶段目标**：从真实失败形成带来源、固定初始状态和独立评分的案例，加入新题集版本，建立材料保留和本地备份。\n\n**补细条件**：需要 P1/P2 实际证据缺口、首个重复出现的失败及其可重建环境；据此选择最小案例结构与开发/回归/保留集管理方式。\n\n## P5 · 本地实验工作台\n\n**阶段目标**：以配套本地 Web 应用串联运行时间线、版本对比、案例和实验结论，保留可核查来源。\n\n**补细条件**：需要真实包规模、常见诊断路径和 P4 案例使用反馈，再决定独立仓库、框架、索引布局与交互性能门槛；不复制 Ink 控制面。\n\n## P6 · 基线与回归门禁\n\n**阶段目标**：建立可恢复基线、采用/拒绝决定及回归规则，使每次修改有明确比较对象和退步处理路径。\n\n**补细条件**：需要多个固定协议实验的波动和成本数据、人工评分复核结果，以及实际运行频率，才能校准阈值、必跑题和 CI 预算。\n\n## P7 · 可选观测集成与其他扩题\n\n**阶段目标**：接入实际需要的其他评测源或观测后端，保持本地事实与比较协议完整。\n\n**补细条件**：需要一个本地能力无法解决的真实场景和端点/隐私决定；逐个评估本地 coding、长任务 adapter 与 OTel/Langfuse/Phoenix；SWE-bench 和 Terminal-Bench 已归 P2/P3 主线。\n\n## 阶段依赖与开发规范\n\n`P1 → P2 → P3 → P4 → P5 → P6`；P7 由具体需求触发，必须先满足所需证据与协议合同。\n远期顺序可依据真实反馈调整，调整要记录依据并重新评审受影响的范围与验收条件。\n\n后续各 change 遵循项目 Spec → 失败测试 → 实现 → Review/mutation → 学习笔记的流程。\n与当前 UX 工作共用代码时先检查工作树归属，保持每阶段可识别的 diff，不自动提交其他工作。\n各阶段完成记录追加至 [task-log.md](task-log.md)，区分规划复核、工程验证、真实模型和人工验收。\n"},{"label":"design","path":"openspec/roadmaps/build-agent-lab/design.md","text":"# Agent 实验台：观测、版本与评测设计\n\n\u003e 版本：v2，2026-11-08。状态：规划方案已复核，待实施规格；功能尚未实现。\n\u003e\n\u003e [实施路线图](roadmap.md) · [任务与评审记录](task-log.md)\n\u003e\n\u003e 适用对象：mini-harness 的个人开发与使用。本文是配套实验台的目标设计，现有能力以源码和 [MILESTONES](../../../docs/MILESTONES.md) 的验收证据为准。\n\n**2026-11-08 用户反馈增量**：首版结果阅读原型不足以支撑真实业务，当前明确优先定位实际编码任务的失败、反复和高消耗。\n补充 [业务旅程与诊断边界](business-workflows.md)，并以三个真实历史样本重做诊断原型。下一版入口围绕任务结果、请求/工具/上下文、证据假设与最小验证；版本对比和双榜评测承接后续验证。\n这是 v2 复核后的设计输入，尚未纳入独立实施评审，不改变下文 P1–P7 的未实施状态。\n\n## 需求与目标态\n\n### 痛点与受众\n\nOwner 需要持续改善 coding Agent，并能解释每次改动的收益与代价。现有运行记录和评测入口分散，难以从真实失败追到实际版本，再以相同条件验证修复。Git 提交、任务结束、一次评测分数分别只能回答部分问题。\n\n首要用户是本项目开发者；AI 助手消费同一份机器可读证据辅助分析。产品成功取决于一次优化能否形成可核查的闭环，而非收集的事件数或面板数量。\n\n主要外部能力标尺是 **SWE-bench 与 Terminal-Bench**。内部小题集服务快速自检，真实使用回归服务问题防复发；两者与主基准各有用途，不能替代主基准的运行、评分与对照。\n\n### 目标态与验收门槛\n\n| 需求 | 优先级 | 可观察的目标与验收方法 |\n|---|---|---|\n| R1 解释运行 | 必须 | 从一个任务定位各段运行、实际配置、关键动作、代码变更和验证证据；缺失记录明确显示未知 |\n| R2 标识版本 | 必须 | 区分 Agent 实现、被操作仓库、题集和评分器；同一 HEAD 下的不同有效改动不会被合并成同一版本 |\n| R3 对照实验 | 必须 | 固定条件比较基线与候选，逐题展示改善、退步、成本与不可比原因，保留所有尝试 |\n| R4 失败转回归 | 必须 | 将一个真实失败整理成独立案例；重建初始状态、确认失败、验证修复，再加入题集新版本 |\n| R5 管理基线 | 必须 | 基线引用明确版本、协议及完整证据；后续回归可定位到具体案例并恢复此前的运行配置 |\n| R6 阅读与分析 | 后续必须 | 通过本地工作台串联运行、版本对比、案例和实验；人工诊断与机器事实分别展示 |\n| R7 外部集成 | 按需 | 能选择导出到观测后端；关闭后仍可完成本地闭环 |\n| R8 主基准评测 | 必须 | SWE-bench 与 Terminal-Bench 各自完成固定版本运行、原生评分导入、逐题对照和证据追溯；子集与全量、不同版本分别显示 |\n\n端到端产品验收：选择一个实际遇到的 coding 失败，完成“取证 → 案例 → 修复 → 对照 → 回归 → 基线”，展示每个结论对应的原始证据。一次演示通过仅证明流程可用，不能代替模型能力的统计证据。各阶段独立验收范围见路线图。\n\n### 范围与不做的事\n\n- 做：单人、本地优先的任务证据、版本身份、实验比较、案例管理与基线记录。\n- 暂不做多租户 SaaS、账号/计费和远程协作：目前只有个人使用需求；出现第二位独立使用者或跨机器协作瓶颈时重评。\n- 暂不做自动修改提示词并自动发布：尚无经过验证的评分和回滚依据；积累可信基线后再评估。\n- 两个主基准分别对标，不合成一个跨榜综合分；正式榜单发布由用户另行发起并遵循当时资格与审核规则。需要正式上榜时补齐提交材料与资格核对，不把发布纳入默认运行副作用。\n- 暂不实现逐 token 重放或承诺模型结果完全重现：保存环境和输入不能冻结远端模型；出现确定性本地推理需求时另评。\n- 本轮不创建新仓库、不部署服务、不运行付费评测；这些属于后续实施工作。\n\n## 1. 从第一性原理推导\n\n一次可观察结果可表述为：\n\n`结果 = F(Agent 实现, 模型与参数, 有效指令与上下文, 工具与权限, 初始仓库, 运行环境, 人工干预, 随机因素)`。\n\n一次评测结论还依赖 `题集 + 评分器 + 实验协议`。因此：\n\n| 基本事实 | 推导出的设计约束 |\n|---|---|\n| 优化需要比较前后结果 | 每个实验先声明假设、实验变量和保持不变的条件 |\n| 不同原因可以产生相同分数 | 保留逐题结果和过程证据，不能仅存总分 |\n| 记录缺失无法靠展示补回 | 区分事实、派生指标、人工标签和推测；缺失不能补成成功或零消耗 |\n| 代码与上下文共同决定行为 | Git commit 之外记录实际生效输入；哈希与可恢复快照分别管理 |\n| Agent 会写文件和执行命令 | 阅读历史与重新执行分离；执行仍经过 ApprovalGate 和现有隔离边界 |\n| 真实模型具有波动 | 预先定义重复次数、停止条件和失败处理，保留所有尝试 |\n| 观测是辅助能力 | 观测失败不能更改权限或任务结果；评测证据缺失则阻止生成可信比较结论 |\n| 优化时间与评测预算有限 | 先覆盖高频失败与关键不变量，再根据证据扩题和接平台 |\n\n## 2. 现状与架构边界\n\n### 2.1 现状核查（2026-11-08）\n\n本轮工作树含其他未提交工作；以下是已读取源码的结构事实，不是全量测试结论，也不把 Git HEAD 等同于工作树。\n\n| 已有能力 | 事实入口 | 本项目要补齐的部分 |\n|---|---|---|\n| run/LLM/tool/approval/usage 事件 | [trace.py](../../../app/session/trace.py)、[agent.py](../../../app/runtime/agent.py) | 跨来源统一身份、实际运行快照与证据完整性 |\n| 会话日志、轮次与完成证据 | [store.py](../../../app/session/store.py)、[evidence.py](../../../app/session/evidence.py) | 跨 run 聚合与证据导航 |\n| trace 聚合 | [observability.py](../../../app/session/observability.py) | 关联版本与评测结果，区分不可得的统计 |\n| 内部 eval 的协议指纹和独立检查 | [internal.py](../../../app/eval/internal.py) | 固定执行者版本，明确实验变量并比较候选 |\n| 本地基准的隐藏检查、多次运行、续做成本 | [bench_local.py](../../../scripts/bench_local.py) | 完整快照、统一协议身份与案例生命周期 |\n| SWE-bench 源码哈希、数据 revision、评分器信息 | [swebench.py](../../../app/eval/swebench.py) | 纳入统一索引；不能用公开开发子集代替完整榜单 |\n| 长任务历史 | [history.py](../../../app/eval/history.py) | 当前按 mode/scenarios 分组；补模型、环境、评分器等比较约束 |\n| Harbor 容器内自定义 Agent | [adapter.py](../../../bench/adapter.py)、[bench README](../../../bench/README.md) | 已有 BaseInstalledAgent、telemetry 与 patch 导出；需补主基准身份、试次映射、版本兼容和轨迹材料 |\n| Verified 评分辅助与历史运行记录 | [补丁收集](../../../scripts/collect_predictions.py)、[报告汇总](../../../scripts/bench_report.py)、[经验记录](../../../docs/specs/harbor-benchmark-lessons.md) | 历史记录含官方 harness 三题结果；本轮未复跑，不认定完整 Verified 或 Terminal-Bench 已验收 |\n| OTel 分阶段设计 | [OTel 规格](../../../docs/specs/otel-observability.md) | 尚未实现；作为可选投影出口，不是实验台事实源 |\n\n### 2.2 当前与目标数据流\n\n```text\n当前：Ink → Python Agent → session/trace/rounds/budget\n      多个 eval runner → 各自报告 → 各自历史查询\n\n目标：Ink → Python Agent → 本地原始证据\n                          ↓ 采集/封装适配器\n      既有 eval runner → 版本化证据包 → 导入校验 → 可重建索引\n                                                ↓\n                              运行详情 / 实验比较 / 案例 / 基线\n                                                ↓ 可选\n                                         OTel / 外部平台\n\n      显式实验请求 → 既有 runner → ApprovalGate → 独立工作区 → 独立评分\n```\n\n### 2.3 组件及归属\n\n| 组件 | 职责 | 部署/技术边界 |\n|---|---|---|\n| 采集与封装适配器 | 捕获身份、引用本地事实、封装证据 | mini-harness `app/session/`；runtime/入口注入配置，不反向 import runtime |\n| 评测适配器 | 冻结实验条件、调用既有 runner、转换报告 | `app/eval/` 与现有 scripts；日常运行不能 import eval |\n| 主基准执行与评分桥接 | 关联 Harbor job/trial、SWE-bench prediction/evaluation、原生结果 | 复用 `bench/adapter.py` 和官方工具；Harbor 为可选评测依赖，不进入 core 或日常启动 |\n| 证据协议 | 定义版本、对象身份、完整性与错误语义 | 由生产端维护协议及兼容夹具；消费者只能按协议读取 |\n| 导入与查询服务 | 校验包、建立索引、计算派生视图 | 实验台独立本地进程；首选 Python + SQLite，依赖在实施时锁定 |\n| 本地工作台 | 证据阅读、比较、案例编辑与实验记录 | 配套 Web 界面，候选 TypeScript/React；不替代 Ink 的 Agent 操作入口 |\n| 外部观测适配器 | 将已落盘证据投影为外部 trace/score | 可选，遵守既有 OTel 的默认关闭、隐私及 bench 边界 |\n\n## 3. 架构决策\n\n### 决策 1：独立实验台，通过证据协议连接\n\n**选择**：按配套项目设计，先在本仓保存规划与生产端协议；消费者不直接 import mini-harness 私有模块。独立仓库的实际创建和技术栈细化留到本地工作台阶段。\n\n| 候选 | 系统代价 | 用户体验 | 开发循环 |\n|---|---|---|---|\n| 全部嵌入 Ink/后端 | 少一个进程，但观测与运行耦合 | 入口集中，跨版本表格受终端限制 | 每次 UI 演进触碰主工作台 |\n| 独立本地实验台 + 稳定证据协议（采用） | 多一个协议和索引，可单独替换 | 可跨会话阅读与比较 | 生产端变动小，协议需双端夹具验证 |\n| 平台全面托管 | 依赖其数据模型与服务 | 通用 trace/实验界面现成 | 仍需定制仓库、权限、评分适配 |\n\n当前以开发循环和结果可信度为主：先稳定跨版本证据，接受额外的协议维护成本。已有 harness 正在演进，本规划是配套能力演进，不初始化整套新工程工作流。\n\n### 决策 2：事实、索引、判断分别保存\n\n**选择**：本地日志及不可变证据包保存事实；SQLite 保存可重建索引；人工注释和实验决定保存为带作者/时间/证据引用的独立记录。备选“直接把数据库当唯一源”恢复复杂；“完全扫描文件查询”可以作为 P1 只读入口，达到实测瓶颈再加索引。\n\n开发循环优先：原始数据可以重新解释和迁移，不必为展示变化重跑模型。代价是需要管理引用和保留策略。\n\n核心对象的最小合同如下；这是目标协议，字段精确 schema 在 P1 change 冻结。\n\n| 对象 | 身份与核心字段 | 生命周期 |\n|---|---|---|\n| RunManifest | `schema_version:int`、`bundle_id:string`、`source_namespace:string`、`session_id:string?`、`task_id:string?`、`run_id:string`、`segment_id:string?`、`parent_run_ref:object?`、`agent_revision:object`、`target_revision:object`、`effective_config:object`、`started_at:string` | 启动时冻结；运行终态写单独 Result，不能回填改写起始事实 |\n| EvidenceArtifact | `artifact_id:sha256`、`kind:string`、`relative_path:string`、`size_bytes:int`、`capture_status:enum`、`redaction_version:string?` | 只引用包内文件；复制或清理产生新记录，不能静默改正文 |\n| RunResult | `run_ref:object`、`execution_status:string`、`stop_reason:string?`、`integrity:enum`、`artifact_refs:list`、`usage:object` | 追加；缺终态保持 incomplete，不能从最后一句回答推断成功 |\n| CaseRevision | `case_id:string`、`revision:sha256`、`source_run_ref:object?`、`input_ref`、`fixture_ref`、`grader_ref`、`environment_ref`、`tags:list`、`exposure:enum` | 草案→可重建→启用→退役；内容变更生成新 revision，退役不删除历史 |\n| SuiteRevision | `suite_id:string`、`revision:sha256`、有序 `case_revisions:list`、`split:string` | 成员/顺序/分组变化生成新版本 |\n| Experiment | `experiment_id:string`、`hypothesis:string`、`variants:list`、`controlled_conditions:object`、`protocol_revision:sha256`、`planned_attempts:list` | 运行前冻结；补跑另建实验并引用此前实验 |\n| Assessment | `attempt_id:string`、`grader_revision:sha256`、`validity:enum`、`outcome:enum`、`reason_codes:list`、`evidence_refs:list` | 与运行结果分离；重评分生成新记录，原评分保留 |\n| Baseline | `baseline_id:string`、`agent_revision_ref`、`suite_revision_ref`、`protocol_ref`、`experiment_ref`、`decision_ref` | 人工选定；替换保留 predecessor；不自动发布代码 |\n\n现有 run_id 不是全局身份。外部引用用 `(source_namespace, session_id, run_id)`；无会话来源由适配器明确提供 namespace，不能按时间猜关联。一次任务可以对应多段运行，父子关系未知则留空。正文未知字段保留，但未支持的主 schema 版本拒绝参与比较；迁移产生新投影版本，原包不改。\n\n### 决策 3：版本身份与可复现程度分别表达\n\n**选择**：固定四类版本：执行者、任务输入/目标仓库、题集、评分协议。执行者内容指纹覆盖源码、依赖锁定信息、实际生效配置和指令引用；目标仓库另存初始状态与最终 patch。只记 Git HEAD 作为便宜备选会误合并脏工作树；完全复制所有本机文件成本与隐私代价过大，采用明确清单内的内容快照。\n\n版本记录需要同时区分：\n\n- `identity_known`：知道使用了什么内容；仅有哈希也可能成立。\n- `rebuildable`：依赖的源码、初始文件、指令与环境材料可取回且完整；只有哈希不成立。\n- `rerunnable`：环境和必要凭据当前可用；凭据通过外部配置注入，不进入包。\n- 模型结果可重复性：另记 provider 标识、返回的 revision/fingerprint（若有）、请求参数与时间；不宣称 bit-for-bit 重现。\n\n**采集时机**：日常 run 启动时冻结有效配置和已加载指令，之后动态载入的 skill/指令记录时间和内容引用；结束时捕获目标仓库差异。运行中自身实现可能被修改且未隔离时标记 `execution_snapshot_unverified`，不能仅以结束时源码哈希冒充实际执行版本。正式实验先物化候选快照，再从该快照启动执行者。\n\n未提交改动包括 tracked diff、删除、文件模式及实际使用的 untracked 文件；子模块、LFS、生成物和外部依赖按实际引用记录。缺少其中必要材料时标记 rebuildable=false。不自动 add/commit/stash 用户文件。\n\n用户可见的每次模型调用关联实际有效的输入/工具 schema 指纹及本地证据引用。敏感正文默认不进入可交换包；仅保留摘要的运行可以用于性能观测，缺少必要输入时不能被标成完整重跑案例。以可解释性为主，接受默认包可能无法重跑的代价。\n\n### 决策 4：证据包有明确完整性与导入语义\n\n**选择**：JSON/JSONL 与内容摘要构成可携带证据包；临时写入后完成校验再发布索引。原始日志可能轮转或正在追加，导出须记录已读文件身份、边界和截断状态，不能伪造尚未落盘的事件。相比即时只发网络事件，本地包可离线核查；代价是实时性低于直接遥测。\n\n- 新采集事件具有来源内单调序号和稳定事件身份；旧日志以文件身份/字节位置确定来源记录，不能仅按“内容相同”去重合法重复事件。\n- 重复导入同一 `bundle_id + digest` 幂等；同 ID 不同 digest 产生 conflict，禁止覆盖。\n- `integrity` 取 complete / incomplete / corrupt / legacy_unknown；无权限、缺文件、未知版本单独给出原因。\n- 已完成包的文件摘要与尺寸逐一校验；缺失引用展示 missing，不计作无变更或无错误。\n- 时长使用执行端单调计时，墙钟用于展示；跨进程没有可靠父子关系时只做关联，不用时间排序推断调用树。\n- token 记录 provider 实测/估计来源；未知价格显示 unknown，不显示零成本。任务总量按唯一计费事件汇总，父级汇总和子级明细不能重复计费。\n- 显式导入/导出失败返回结构化错误；运行内的可选观测采集失败只影响观测状态和诊断，不改 AgentResult、审批或 stdout 协议。\n\n**保留**：基线和启用案例引用的材料进入实验台受管证据存储，再允许清理普通源日志；记录 pin/引用关系。既有 cleanup 命令尚不知道这些引用，集成阶段必须补保护或将受管包置于其扫描范围外。手工删除仍可能造成 missing，UI 不能隐藏。\n\n### 决策 5：结果正确性由版本化独立评分决定\n\n**选择**：机制回归、真实模型能力题、真实使用回归分层维护；fake 与 real 分别报告。以独立测试、文件合同、约束检查作为正确性依据；LLM judge 仅补充软指标，其模型、prompt、rubric 也属于评分器版本。只采纳 Agent 自述或仅看退出状态的备选不能验证代码效果。\n\n| 结果维度 | 合同 |\n|---|---|\n| 执行状态 | 保留 done/stopped/cancelled/error 及原因，不直接等同评分 |\n| 评分有效性 | valid / invalid / not_graded；与候选无关的环境准备/评分设施故障、隐藏测试泄露等使结果 invalid；候选造成的失败按下述归属规则判定 |\n| 能力结果 | pass / fail / unknown；仅在评分有效时给 pass/fail；预算内未完成按预定协议判 fail，不因正常暂停算通过 |\n| 约束 | 分别记录未经授权副作用、禁止文件变更、测试篡改等；审批拒绝本身不是缺陷 |\n| 覆盖 | 计划次数、实际启动数、有效数、无效数、取消数、缺结果数同时呈现；空题集返回 no_data |\n\n无效运行不进入有效样本成功率，但必须报告有效样本数/计划数；存在缺测时不能据剩余题目自动晋升基线。人工取消不计为已完成；审批拒绝后如何交付由案例事先定义。运行内验证是过程证据，最终 grader 是单独信任域。\n\n**故障归属**：在协议支持且 preflight 通过的环境中，候选破坏依赖、无法构建或产物执行失败属于能力 fail；不能因评分子命令非零就改记 invalid。评分设施自身失败才记 invalid，并附环境/评分日志。无法区分候选故障与设施故障时保留 invalid，禁止基于剩余样本作改善、采用或基线晋升结论。报告同时列出两边都有效的配对数/计划配对数及未配对原因；分母变化只能描述，不能被解释为能力提升。\n\n评分器和隐藏材料放在 Agent 可写、可读工作区之外，评分在干净重建环境中应用最终产物；拒绝以修改 grader/测试获得通过。独立 worktree 仅隔离版本，并不是安全沙箱；敏感隐藏题需实际的文件/网络访问隔离，未建立时标记可信度限制并禁止当成无污染保留集。\n\n修 bug 类案例须确认起始失败和参考修复可通过；新功能类使用合同不满足/满足的前后检查，不强套 RED 规则。真实失败提取须人工核对隐私和隐藏答案，再固化环境；原始 trace 只是来源，不能直接当作完整案例。\n\n题目按 dev / regression / held_out 管理，记录已曝光历史。保留题一旦用于定向调优就退出保留集并产生新 suite revision；不能靠改标签抹掉曝光。建立不同任务族和外部仓库案例，缓解只测自身已知修复的偏差。\n\n### 决策 6：对照实验先声明可比条件\n\n**选择**：比较协议列出允许变化的维度，其余有效条件保持相同。只比较同一指纹无法比较被刻意修改的代码；任意两个总分直接相减又会混入题集和模型变化，所以采用“实验变量 + 控制条件”的显式合同。\n\n1. 运行前固定假设、候选快照、题目/评分器版本、模型参数、预算、环境、批准策略、并发度、重复次数、顺序和停止规则。\n2. 默认单维变化；一次包级代码改动含多个行为变化时只归因于整个候选包，不能宣称证明某条 prompt 有效。\n3. 按 case revision 配对；题目、grader 或关键环境变化时不给直接差值。历史记录缺必需字段返回 incomparable；可以并排阅读。\n4. 同题可先预定每版本 3 次用于发现明显波动；这不是显著性保证。扩大样本须新实验，不能看到结果后只补有利样本。\n5. transport/tool 重试属于同一尝试、计入成本；重新启动完整任务是新 attempt。断点续做仍关联原任务，预算和成本跨段累计。\n6. 报告逐题胜/负/持平/未知、按任务族汇总、每次尝试结果和成本分布，展示配对有效覆盖和所有未配对原因；候选把失败题变成 invalid 时不得报告总体改善。禁止以 best-of-N 冒充单次成功率；区间估计方法在协议中固定，样本不足直接标注。\n7. 成功率分母按决策 5；成本同时报告全部尝试总消耗和成功样本分布。近零基线不算百分比涨幅；时延区分模型、工具、审批等待。\n8. 运行前核算 `候选数 × 题数 × 重复次数 × 单题上限`，批准最大调用/时间/token 预算；未配置价格时不承诺美元预算。无剩余额度停止新尝试，不自动扩预算。\n\n结果可信度优先于自动化程度。接受早期人工选择实验和判断采用决定，后续以校准后的协议定义回归门禁。\n\n### 决策 7：本地工作台只读运行，执行走既有边界\n\n**选择**：运行页展示任务时间线、diff、验证与来源；对比页展示变量差异和逐题结果；案例页维护案例版本；实验页记录假设、尝试与结论。案例编辑与基线选择是实验台元数据操作，不能修改历史事实。\n\n首个 Web 阶段只读 Agent 运行状态；需要发起实验时走专用请求、固定 runner 及 ApprovalGate。浏览历史不得重放工具调用、执行报告里的命令或把缺失批准视为允许。相比在 Web 内复制一套 Agent 控制面，此边界减少双端语义漂移，代价是日常控制仍在 Ink。\n\nLangfuse 提供 trace/score/dataset/experiment 关联与题集版本；Phoenix 提供基于 OTel 的 tracing 和数据集实验。它们可承担通用视图，但不能替代本项目的仓库快照、独立 grader 和权限合同。后端选型延后到真实包适配试验，依据见参考资料，不预承诺 SDK/OTLP 接入已经兼容。\n\n### 决策 8：遵循仓库的切片开发和证据验收\n\n**选择**：每阶段先形成行为规格，再写失败测试、实现、评审和学习记录。依据 [协作协议](../../../docs/VIBE-PROTOCOL.md)、[AGENTS](../../../AGENTS.md)、[app 模块边界](../../../app/README.md)、[core 模块边界](../../../core/README.md)。实验台是验证开发的辅助工具，不能自行把自己的评分认定为人工验收完成。\n\n- `core/` 继续只依赖标准库，不因观测引入第三方包，也不反向依赖 app。\n- 生产端落盘/遥测适配在 app/session；评测编排在 app/eval；共享接线在现有入口，不新建 app 根级业务模块。\n- 行为修改先加/改测试；提交前跑 `./run_tests.sh`。Ink 改动增加适用 smoke；真实模型 eval 按已授权预算单独记录。\n- 每个切片记录自动验证、真实模型结果、人工使用验收三种状态；用户的 diff review、mutation 和学习笔记遵循既有协议，不由助手代签。\n- 新命令/协议/文件落位同步 README、USAGE、STRUCTURE 与相关规格；只改文档时做链接、引用、差异检查，不把它写成产品测试通过。\n\n### 决策 9：两个主基准复用原生执行与评分，实验台管理证据和比较\n\n**选择**：SWE-bench 和 Terminal-Bench 均作为必需能力。SWE-bench 优先建议 Verified；Terminal-Bench 的目标版本由用户选择，协议不使用浮动 `latest`。现有仓库提及 2.1，可作为试点候选，但不能当作用户已选定版本，也不代表当前官网主榜。实现前锁定数据 revision、runner 与 grader 版本。\n\n| 候选 | 系统代价 | 用户体验 | 开发循环 |\n|---|---|---|---|\n| 自建容器执行与重写评分 | 最大，可控性高但易偏离上游 | 单一入口 | 每次上游变更都要维护评分正确性 |\n| 复用 Harbor/官方 harness，实验台统一证据（采用） | 增加薄适配与格式版本管理 | 同一界面看两榜，保留原生解释 | 复用现有 adapter，以官方评分结果作交叉验证 |\n| 只展示外部榜单/总分 | 成本低 | 能看排名，无法解释本项目变化 | 无法重跑、查错和关联版本 |\n\n当前以评分可信度和复用为主，接受各基准原生环境的差异及维护两条适配链的代价。\n\n#### 主基准合同\n\n| 项目 | SWE-bench | Terminal-Bench |\n|---|---|---|\n| 能力侧重 | 真实仓库 issue 的代码修复 | 容器内终端任务的端到端完成 |\n| 首个版本 | 建议 Verified；Lite/dev 仍可作为独立 smoke 配置 | 精确版本待选择；2.0、2.1 和官网后续版本不得混算 |\n| 执行 | 冻结 mini-harness 候选后复用 Harbor 安装型 Agent，或已有独立 runner | Harbor 运行本项目自定义 Agent，按任务配置执行 |\n| 主评分来源 | 固定版本官方 `swebench` harness 对 prediction patch 评分 | 固定任务 revision 对应的 Harbor verifier 原生结果 |\n| 必留证据 | 原始 patch、实际送评 patch、predictions、instance report、测试输出、轨迹、环境身份 | job/trial 配置、任务 revision、reward、异常、verifier 输出、轨迹、环境身份 |\n| 主指标 | 官方 grader 的 resolved 与规定分母；任务/仓库分布、成本为辅助 | 所选版本规定的 reward 聚合和试次协议；逐题试次分布、成本为辅助 |\n\nSWE-bench 的 Harbor reward 作为诊断视图保存，不能自动升级为官方 grader 成绩。两者不一致时显示 score_disagreement 并保留各自证据，不挑较高值。Terminal-Bench 的 Harbor verifier 则是其原生评分链；不能把 SWE-bench 的来源规则机械套用到它。\n\n```text\nExperiment + 固定候选 + BenchmarkProfile\n  ├─ SWE-bench: Harbor/runner → 原始 patch → 明示转换 → predictions\n  │                                                ↓ 官方 swebench grader\n  │                                          原生报告 + 标准化索引\n  └─ Terminal-Bench: Harbor job → task/trial → verifier reward + 原生报告\n                                                    ↓\n                                    关联 RunManifest → 实验台比较\n```\n\n`BenchmarkProfile` 至少包含 family、variant/version、dataset_revision、split、冻结的 task IDs、selection_hash、任务/镜像摘要、架构/资源/网络限制、runner_version、grader_revision、adapter_revision、patch_transform_revision（如有）、attempts_per_task、预算与原生聚合规则。实验、job、trial/instance、attempt 与本地 run 以显式映射关联，不能从目录名或时间猜测；两个候选的同一任务多次试验按预定 attempt 编号配对。\n\n**原生分数与诊断统计分栏**：原生分数按该基准固定版本的分母、错误与超时处理、聚合公式原样保留；决策 5 的“有效样本成功率”只能作为诊断统计，不能冒充榜单分数。预定全量有缺题、oracle 失败或基础设施错误时，仍显示全部预定任务及原因，不通过删题缩分母获得全量成绩。\n\n**保留完整产物链**：现有补丁收集脚本默认跳过空 patch、过滤测试文件块，且从 job 遍历收集；正式适配必须先核查它与所选协议的兼容性。原始/送评 patch 分别保存 hash 和转换版本；转换规则在运行前固定，不能根据测试结果选择 patch。重复 instance 不覆盖，缺预测/空预测仍保留在任务清单；新文件、二进制与文件模式变化须按官方可接受格式处理，不能静默丢失。\n\n**容器与轨迹**：已有 adapter 的 `SUPPORTS_ATIF=False`，这不等于不能运行，但标准轨迹兼容尚未完成。先保存实际可观测的消息、工具动作与结果；若目标版本/提交路径要求 ATIF，则在该阶段补齐并校验格式，不能事后生成虚构轨迹。固定 CPU/内存/GPU/架构、任务超时、镜像、任务包和外部网络配置；缓存/预装镜像的任何修改都记录，是否符合目标榜单规则必须核对。\n\n**基准与日常行为的差异**：`--bench` 的容器授权档位、禁用的 skill/MCP/profile 等写入 profile；它的成绩只描述该配置。不能据此宣称同模型的日常 Ink 工作流具有相同能力。自动批准仍经 Gate，放宽路径仅适用于一次性基准容器。\n\n**分级运行**：预检/单题 smoke → 预先选定的小集合开发对照 → 固定全量。复用任务缓存但不修改隐藏检查或超时以获得高分；oracle 仅在与 Agent 分离的环境做准备验证，答案与隐藏日志不能进入 Agent 输入。官方所需重复次数覆盖默认“三次”的探索建议；重跑保留新 attempt 和原因，不能只取成功的重跑。\n\n**榜单状态**：local_subset / local_full / submission_prepared / submitted / accepted 分别展示，必须有证据才能升级。公开材料生成可以离线进行，上传或提 PR 属于另行授权的发布动作；accepted 以维护者接纳为准。2026-11-08 核查：[SWE-bench Verified 提交规则](https://github.com/SWE-bench/experiments)存在研究机构与研究材料要求；[Terminal-Bench 2.1 文档](https://github.com/harbor-framework/terminal-bench-2-1)声明社区提交暂关闭、仅维护者运行结果入榜。实验台不承诺个人本地结果必然获官方接纳，具体发布时重新核对规则。\n\n## 4. 存储与协议演进\n\n以下路径为规划，实施阶段根据现有存储约定冻结，不能当作现有命令或目录使用。\n\n```text\nmini-harness/\n  app/session/             生产端采集和证据封装\n  app/eval/                评测与协议适配\n  evals/ 或 benchmarks/    可提交的案例定义、夹具、评分器；沿用既有分工\n  openspec/roadmaps/build-agent-lab/   本文档包\n  .vibe/lab/               运行证据、导入诊断、实验和重跑材料，不提交\n\n实验台自己的工作区/\n  .vibe/lab/artifacts/     受管、按内容寻址的证据\n  .vibe/lab/index.sqlite   可重建查询索引\n  .vibe/lab/annotations/  人工判断与基线选择记录，独立备份\n```\n\n源格式、证据包 schema、索引 schema、评分协议各有自己的版本；升级任何一项不能静默重写其他版本。首版 reader 支持当前主版本与明确列出的 legacy 适配器；未知主版本拒绝索引为可比数据。包校验通过只证明字节与声明一致，不证明来源可信或模型确实执行了所有动作。\n\n## 5. 失败、安全与性能边界\n\n| 场景 | 处理者与用户可见结果 | 验证方式 |\n|---|---|---|\n| 无记录、空题集 | 查询返回 no_data；不显示 100% 通过 | 空目录/空集合夹具 |\n| 缺配置、旧报告 | importer 保留来源，标 legacy_unknown/incomparable | 旧 report 导入 |\n| 断行、崩溃、无终态 | importer 标 incomplete 和位置，保留可读部分 | 中途截断/进程退出注入 |\n| 同 ID 异内容、摘要不符 | importer 报 conflict/corrupt，不覆盖已导入事实 | 篡改一个字节后导入 |\n| 路径穿越、符号链接逃逸 | importer 拒绝包外读取；UI 不跟随路径执行 | 恶意路径、链接夹具 |\n| 磁盘满、快照不可读 | collector 诊断并标缺失；显式导出失败，不发布完整包 | I/O 错误注入 |\n| 评分设施/准备环境失败 | evaluator 按决策 5 判断归属；设施故障为 invalid，候选引起的构建/执行失败为 fail；归属不明不作改善结论 | 故障 grader/候选破坏依赖的对照 |\n| 预算耗尽、人工取消 | runner 停止后续尝试，账本保留，按预定协议评分 | 两候选中途停止 |\n| 外部 exporter 离线 | exporter 有界失败，Agent 结果与本地证据不变 | 离线/超时注入 |\n| 索引损坏、源材料被删 | query 报告不可用，可重建索引；材料缺失不可重建 | 删除索引/删除被引用文件 |\n\n导入内容属于不可信数据：不执行命令、不自动安装依赖、不渲染未净化 HTML；新 Web 界面仅绑定本机，状态变更需防跨站请求，文件读取限定受管根目录。凭据、完整环境变量、个人偏好正文不默认写入交换包。脱敏产生派生产物并记录规则版本，不能用脱敏后哈希冒充原始内容哈希。\n\nP1 的资源边界：离线导出/导入不调用模型、不发外部请求；逐行/分块处理，不按日志总量一次性载入内存。实施规格在写实现前，以当前机器和固定 10 万事件夹具测量基线，并锁定导入峰值内存、耗时、运行采集开销三个数值门槛；不允许验收后反向调整门槛。Web 查询的延迟目标在 P5 补细时根据真实包规模确定。\n\n日常采集的额外快照有大小/耗时上限，触限返回明确缺失原因；正式实验要求的快照无法完成时，preflight 阻止开始模型调用。资源上限的具体值由 P1 规格基线测量确定。\n\n## 6. 测试与验收策略\n\n| 层次 | 重点 | 必需反例 |\n|---|---|---|\n| 单元 | 身份、规范化摘要、状态分类、比较条件、成本聚合 | 同 HEAD 异内容；unknown 不转零；父子成本不双计 |\n| 集成 | 真实日志导入、runner 适配、工作区重建、独立评分 | 重复导入；日志轮转/截断；缺评分器；隐藏文件隔离 |\n| 端到端 | fake 小任务生成证据，再运行固定 A/B，最终真实失败转回归 | 一方失败/缺测仍完整报告；候选把困难题变成 invalid 不得显示改善；读报告零副作用 |\n| 真实模型 | 固定协议小题集，多次运行与全部成本 | 预算暂停不当成功；保留题曝光后不能维持 held_out |\n| 人工 | 在实验台定位失败、解释变量与分母、选择基线 | 没有证据时能识别未知，不被图表暗示成功 |\n\n需求追踪：R1/R2 → P1；R3 → P2 并由 P3 扩展；R8 → P2（SWE-bench）/P3（Terminal-Bench）；R4 → P4；R6 → P5；R5 → P6；R7 → P7。每个实施 change 将本表细化为条款、测试、实现和证据映射。P1/P2 无需等待完整 Web 产品；报告和机器可读查询即为独立交付。\n\n## 7. 假设、风险与回退\n\n| 假设/风险 | 失效信号 | 应对 |\n|---|---|---|\n| 单人本地工作量可用文件与 SQLite 承载 | 固定样本超过锁定的资源门槛 | 优化增量索引，再依据实测评估服务化 |\n| 已有 trace 足够定位主要失败 | 经常缺起始输入/父子关系/终态 | 补对应生产端事实，不在 UI 猜测 |\n| 自身仓库题可代表部分日常需求 | 改善只发生在已知题，实际任务无收益 | 增加不同任务族/仓库的保留案例 |\n| 评分器能反映完成 | 人工复核发现假阳性或假阴性 | 修 grader 形成新版本，旧结果不悄改 |\n| 模型标识能稳定比较 | provider 别名漂移或重复运行波动过大 | 记录时间窗/可得修订信息，降级结论，重新配对实验 |\n| 只读观测不会显著拖慢运行 | 超过 P1 开销门槛 | 关闭可选采集，保留本地原有 trace；优化后重测 |\n\n回退路径：关闭新增采集/导出后恢复现有 Agent 路径；实验台删除索引后从原包重建；基线回退是显式选择旧引用和另行执行部署动作，不自动 reset 用户工作区。数据库结构升级采用可重建投影，不把数据库迁移成功等同证据完好。\n\n## 8. 与既有规格的关系\n\n| 既有文档 | 关系与本轮处理 |\n|---|---|\n| [roadmap](../../../docs/roadmap.md)、[MILESTONES](../../../docs/MILESTONES.md) | 服务于可靠 coding 与评测扩题；新增规划入口，不提升已有验收状态 |\n| [evaluation](../../../docs/specs/evaluation.md) | 复用既有预算、协议指纹和独立评分；P2 改动协议时同步更新 |\n| [Harbor 接入](../../../docs/specs/harbor-benchmark.md)、[经验记录](../../../docs/specs/harbor-benchmark-lessons.md) | 复用 adapter 和历史问题，P2/P3 核查源码、依赖版本与真实产物；较早规格的待验收声明不覆盖较晚运行记录，历史成绩不算本轮验收 |\n| [本地编码基准](../../../docs/specs/local-coding-benchmark.md)、[长任务评测](../../../docs/specs/long-horizon-eval.md) | 逐个 adapter 接入，不把不同任务类型混为同一分数 |\n| [OTel 规格](../../../docs/specs/otel-observability.md) | 保持 M0–M3 默认不外发 eval/bench；P1/P2 的本地证据合同不等于开启遥测，外发仍按其阶段决定 |\n| [open-decisions](../../../docs/specs/open-decisions.md) | 集中观测端点与真实模型预算仍待相关阶段确定；本规划不替用户作出外发或费用授权 |\n| [工作台 UX 规划](../improve-workbench-ux/roadmap.md) | Ink 运行控制、阅读体验继续按其切片推进；实验台处理跨运行分析，不重复实现控制面 |\n\n本包尚未生成 capability specs 或正式 ADR。后续 change 从本设计导出可执行契约，不把规划草案当已生效运行协议。\n\n## 9. 实施前决定与延后事项\n\n| 事项 | 当前建议/状态 | 负责人及触发点 |\n|---|---|---|\n| P1 字段 schema、快照清单与资源阈值 | 方向见决策 2–4；实施设计锁定 | Implementer 提案，Owner 审阅；P1 实现前完成 |\n| P2 首个题集与模型开销 | 建议 Verified 冻结小集合；fixture 验证先行，真实预算单独确定 | Owner 决策；首次付费运行前完成，不阻塞离线实现 |\n| Terminal-Bench 主版本 | 显式待选；已有 2.1 文档仅为试点参考 | Owner 选择；P3 补细前固定版本及数据 revision |\n| 独立仓库名称、Web 框架与部署方式 | 推荐本地配套应用；具体选型延后 | P5 补细时按实测包规模确定 |\n| 成绩/成本回归阈值 | 不预设任意百分比 | P6 依据多次基线分布校准后由 Owner 确定 |\n| Langfuse/Phoenix/OTel 目标 | 保留兼容方向，尚未选定或部署 | P7 以一份真实证据包试接后决定 |\n| 备份位置与保留期限 | 基线材料必须可恢复；当前不约定外部服务 | P4 案例存储投入日常使用前确定本地备份方案；远程另行决策 |\n\n## 10. 参考资料\n\n2026-11-08 核查官方资料；这些资料支持候选能力，不构成项目已集成的证据。\n\n- [Langfuse Evaluation Concepts](https://langfuse.com/docs/evaluation/core-concepts)：在线观测与离线实验的关联、任务及评分模型。\n- [Langfuse Datasets](https://langfuse.com/docs/evaluation/experiments/datasets)：题集与历史版本支持。\n- [Phoenix 官方仓库](https://github.com/arize-ai/phoenix)：OTel tracing、数据集、实验及提示词管理能力。\n- [SWE-bench 官方评测指南](https://www.swebench.com/SWE-bench/guides/evaluation/)：prediction 格式与容器化评分。\n- [SWE-bench 官方提交仓库](https://github.com/SWE-bench/experiments)：提交资格、材料与维护者核验规则；发布时重新检查。\n- [Terminal-Bench 2.1 官方仓库](https://github.com/harbor-framework/terminal-bench-2-1)：版本变更、重复试验与社区提交状态；只适用于该版本。\n- [Terminal-Bench 官方入口](https://www.tbench.ai/)：当前主榜可能变化，不能用入口展示替代固定数据 revision。\n- [Harbor 自定义 Agent](https://docs.harborframework.com/agents/custom-agents)：安装型适配接口；本仓锁定版本需独立验证兼容性。\n- [Harbor 本地结果视图](https://docs.harborframework.com/results/view-job-results)：可先复用原生 job/trial 查看器，实验台补充跨来源版本与比较关系。\n"},{"label":"task-log","path":"openspec/roadmaps/build-agent-lab/task-log.md","text":"# Agent 实验台规划与执行记录\n\n\u003e 状态：ACTIVE（v2 主基准规划已复核；用户反馈明确诊断优先，v0.2 原型已重做，待体验反馈）；P1–P7 均未实施。\n\u003e\n\u003e [设计](design.md) · [路线图](roadmap.md)\n\n## 使用约定\n\n- 按时间倒序记录规划调整、阶段开始、验证、验收与回退；每条完成记录关联路线图阶段。\n- 源码核查、自动测试、真实模型结果、人工验收分别记录，不互相代替。\n- 评审及执行临时产物写 `.vibe/`；正式设计和评审处置进入本包。\n- 规划复核不等于 Owner 已批准全部实现细节，也不等于付费评测或远程外发授权。\n\n## Review 处置\n\n### v2：SWE-bench 与 Terminal-Bench 主线\n\n本轮 `run_id=20261108T131808Z-kx8nx60u`，strategy、plan-eng 与 fallback 三份结果均已完成，前缀回执与本轮归属已核验。\n\n| 来源 | 发现 | 处置 |\n|---|---|---|\n| strategy | findings=[]；双主基准覆盖、阶段内聚及旧阶段号历史均一致 | ✅ 主审已核对，P2/P3 保持必需主线 |\n| plan-eng | findings=[]；原生评分、试次映射、patch 产物链及权限边界完整 | ✅ 主审已核对，具体格式与版本在实施阶段冻结 |\n| 独立第二意见 | findings=[]；本地/上榜、分母、全部试次和独立评分无新增遗漏 | ✅ 主审已核对，无遗留未处置项 |\n\n`runner=claude reason_code=preflight-error`：helper exit 1，`timeout/gtimeout` 仍缺失，跨模型 runner 未启动。\n**降级**：同宿主独立第二意见在 300 秒预算内完成；三项子代理均接受 `gpt-6.1-sol / medium / fresh` 请求，`effective_effort=unknown`。不把本轮称为跨模型评审。\n\nv1 处置与历史记录保留如下，不以旧评审替代本轮范围复核。\n\n### v1：初始整体规划\n\n本轮 `run_id=20261108T095014Z-463q37n8`，strategy、plan-eng 与 fallback 三份结果均已收齐，核验本轮归属和前缀回执。主审复核如下；规划评审不代表实现或人工验收。\n\n| 来源 | 发现 | 处置 |\n|---|---|---|\n| strategy | findings=[]；目标覆盖、阶段内聚、复用与规范边界无新增发现 | ✅ 已核对，保留近期两阶段与远期补细条件 |\n| plan-eng | findings=[]；身份、评分、证据与资源前置条件无新增发现 | ✅ 已核对，具体 schema 和性能值仍须在 P1 实现前锁定 |\n| 独立第二意见 F1（P2） | 将候选引起的构建失败归入 invalid，可能让困难题退出分母而显得改善 | ✅ 采纳：design 决策 5/6、失败表与端到端反例明确故障归属及配对覆盖；roadmap P2 增加“困难题变 invalid 不得改善”验收 |\n\n`runner=claude reason_code=preflight-error`：helper exit 1，本机缺少 `timeout/gtimeout`，跨模型 runner 未启动。\n**降级**：同宿主独立第二意见 `gpt-6.1-sol` 在 300 秒预算内完成，不声称取得跨模型评审。\n两镜及 fallback 请求 `reasoning_effort=medium`，接口接受；实际 `effective_effort=unknown`，不把请求档位当作已证明的运行档位。\n\n## 收尾核验\n\n### v2 核验记录\n\n- 判定点②：①评审处置通过，②三件套引用与 R1–R8 阶段映射通过，③未引用历史存档通过；直接增量生成且无全局术语/ADR 写入，④不适用。\n- 三件套 47 处本地链接/锚点检查通过，README 与项目 roadmap 已同步主基准入口；P1/P2 均引用设计决策。\n- 主审核查本轮差异仅更新规划、索引与评审页面；未运行产品测试、Docker、付费评测或公开发布，不提升既有里程碑状态。\n- Review 结构检查只证明小节存在且非空；本轮三份结果及 v1 既有处置由主审逐条核验，不用机械检查代替内容评审。\n\n### v1 核验记录\n\n- 判定点②：①评审处置通过，②三件套引用完整性通过，③正式文档未引用历史存档通过；直接生成且无讨论备忘或全局术语/ADR 写入，④不适用。直接生成包不由草稿备忘扫描机制发现，从 README 与 docs/roadmap.md 索引进入。\n- 结构脚本返回 `section-ok-DISPOSITION-UNCHECKED`，只证明 Review 小节存在且非空；逐条是否处置由主审判断。本轮唯一发现 F1 已核对并采纳，无遗留未处置项。\n- 三件套及项目入口 40 处本地链接/锚点检查通过；已细化 P1/P2 回指设计决策，规划完成记录关联路线图概览；需求 R1–R7 均有阶段归属。\n- 新文档无未闭合代码块、占位符或行尾空白；项目入口差异已核对，仅追加本规划入口，未删除其他工作内容。文档差异检查通过。\n- 本轮仅文档变更，未运行产品测试、真实模型评测或修改既有里程碑验收状态；产品验证命令作为未来实施阶段的退出条件。\n\n## 2026-11-08\n\n### [阶段 0 / 原型修订] 从报告对比转向真实任务诊断\n\n- **用户反馈**：首版流程已串通，但不足以支撑真实业务；明确优先“定位真实编码任务为何失败、反复或成本过高”。\n- **重审**：[业务旅程与边界](business-workflows.md)；新增项目业务术语，区分用户任务、运行段、诊断发现/假设、候选、试次与改进记录。\n- **交付**：原首页改为诊断，旧对比页保留。接入 recall-guard 独立失败、P3 预算暂停、execution-chain 三次消耗波动三个真实历史样本；可查看请求/上下文、工具参数与结果、重复动作，并引用证据生成内存草案。\n- **核验**：三样本、请求切换/峰值定位、重复筛选、来源查看、草案生成与缺证据禁用、旧双榜页面往返均经浏览器检查；未运行真实 Agent 或评测。\n- **限制**：真实样本来自本地评测/受控验收，尚非任意日常任务自动采集；精确身份映射、完整输入和部分逐请求 usage 缺失。事实与假设分栏，未知不补值。\n- **状态**：旧版业务覆盖未满足，不能用旧版工程点击通过代替本次体验验收。新增设计未声称经过原 v2 的独立评审；实施时须纳入 P1/P2 规格复核，P1–P7 状态不变。\n\n### [阶段 0 / 原型] 验证实验、对比与任务证据的阅读流程\n\n- **关联**：[原型核验与数据缺口](prototype-review.md)、[P1 运行证据包](roadmap.md#p1--可信运行证据包)、[P5 本地实验工作台](roadmap.md#p5--本地实验工作台)。\n- **范围**：用户确认先制作原型；单文件离线 HTML 串联三视图与五条演练，不提前实现 P5 控制面。产物写 `.vibe/lab-prototype/`，不提交。\n- **数据**：六份显式模拟实验 + 两份真实 SWE-bench Lite/dev 历史摘录；真实记录预算、协议及身份证据不足，不能将 0/1 → 1/1 解释为 Agent 收益。Terminal 版本仍未选定。\n- **核验**：五场景浏览器点击、退步筛选、两侧证据/来源切换、缺失与空补丁区分、搜索空态、同实验和跨基准阻断通过；脚本语法、10 个源文件摘要核对通过，采集到的浏览器 error 日志为空。\n- **状态**：原型工程核验完成；用户是否能独立定位问题、信息是否够用仍待反馈。未改生产行为、未跑真实评测、未提交代码，不提升里程碑完成状态。\n- **下一步**：根据体验反馈收敛字段与交互，把完整运行身份、逐试次证据、未知值传播和原生评分边界纳入 P1/P2 实施输入。\n\n### [阶段 0 / 增量规划] 将 SWE-bench 与 Terminal-Bench 提升为主基准\n\n- **关联**：[roadmap.md 概览](roadmap.md#概览)、[P2 SWE-bench](roadmap.md#p2--swe-bench-版本对照)、[P3 Terminal-Bench](roadmap.md#p3--terminal-bench-版本对照)。\n- **生命周期**：continue；用户明确这两个是主要评测榜单，更新尚未实施的阶段，不推翻已交付功能；原 P3–P6 顺延为 P4–P7，没有已发出的实施 change 需改名。\n- **判定点①**：目标受众、范围、技术候选、阶段构思与主要风险已明确，无商业化信号，直接增量生成并重新评审。\n- **变更**：新增 R8 与设计决策 9；P2 由内部小题集改为 SWE-bench 对照，新增必需 P3 Terminal-Bench；内部 eval 保留快速自检。\n- **核查**：本仓已有 Harbor adapter、patch 收集与报告脚本，历史经验记录含官方 harness 三题结果；未复跑，不能据此认定本实验台已支持完整双榜。\n- **版本**：建议 SWE-bench Verified；Terminal-Bench 主版本尚未选定，2.1 仅是已有文档线索，协议必须显式固定版本，不使用 latest。\n- **边界**：本地运行/官方工具评分、提交材料准备、公开发布、维护者接纳分别记录；SWE-bench Harbor reward 与官方 grader resolved 分开，Terminal-Bench 沿用其原生 verifier。\n- **结果**：增量独立评审、链接与差异检查完成，合并评审页同步刷新。未改代码、未运行 Docker/付费模型、未公开上传或提交榜单。\n\n### [阶段 0 / 规划] 从持续优化目标推导证据、版本与评测闭环\n\n- **关联**：[roadmap.md 概览](roadmap.md#概览)。\n- **状态**：三件套完成并经独立评审与主审修订；未实施产品功能。\n- **判定点①**：目标受众、范围、候选技术路线、阶段构思、主要风险五项具备；个人项目无商业化信号，直接生成，未进入拷问相位。\n- **生命周期**：create；目标包此前不存在；扫描未发现待续的草稿备忘。\n- **依据**：用户要求先写文档；AGENTS、VIBE-PROTOCOL、roadmap、MILESTONES、app/core 分域、既有 trace/eval/history 和 OTel 草稿，以及核查过的官方候选平台资料。\n- **范围**：近期 P1/P2 写满前置/目标/子任务/验收/产物；P3–P6 保留目标与补细条件。\n- **技能适配**：遵循项目运行产物 `.vibe/` 规则，覆盖技能默认 `.outside-voice/` 目录；三件套仍在标准 roadmap 路径。沿用已有 harness 架构，不初始化新仓库或全局 workflow。\n- **工作树**：已有大量 Plan/UX 未提交改动，本轮只新增本文档包与必要文档入口，不归入本轮实现或验收。\n- **下一步**：实施需另开 P1 change，先锁定 schema 与性能基线，再遵循失败测试优先流程；文档可纳入版本控制，本轮不提交其他未完成工作。\n"}]</script>

      try { localStorage.removeItem(STORE_KEY + ':probe'); } catch (e2) { /* 删不掉也不影响使用 */ }
    }
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (!data || !Array.isArray(data.notes)) return;
      var maxN = 0, repaired = false;
      data.notes.forEach(function (n) {
        if (!n || typeof n.quote !== 'string' || typeof n.comment !== 'string' || typeof n.n !== 'number') return;
        var id = n.id;
        if (!isNoteId(id)) { id = newNoteId(); repaired = true; }
        state.notes.push({
          id: id, n: n.n, doc: String(n.doc || ''), heading: String(n.heading || ''), quote: n.quote,
          before: String(n.before || ''), after: String(n.after || ''), comment: n.comment, copied: !!n.copied,
          inFigure: n.inFigure === true,
        });
        if (n.n > maxN) maxN = n.n;
      });
      state.next = Math.max(Number(data.next) || 1, maxN + 1);
      if (repaired) saveState();
    } catch (e) { /* 存档损坏：当作没有意见 */ }
  }

  function findNote(id) {
    for (var i = 0; i < state.notes.length; i++) if (state.notes[i].id === id) return state.notes[i];
    return null;
  }

  // ── 高亮：按文本节点分段包 <mark>，跨粗体、跨列表项的选区每段各包一个 ─────────────
  function docBodyByLabel(label) {
    var sections = document.querySelectorAll('section.doc');
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].getAttribute('data-label') === label) return sections[i].querySelector('.doc-body');
    }
    return null;
  }

  function rangeAt(root, start, length) {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var pos = 0, node, range = document.createRange(), startSet = false, end = start + length;
    while ((node = walker.nextNode())) {
      var len = node.data.length;
      if (!startSet && start < pos + len) { range.setStart(node, start - pos); startSet = true; }
      if (startSet && end <= pos + len) { range.setEnd(node, end - pos); return range; }
      pos += len;
    }
    return null;
  }

  // 节点本身是元素就取它，文本节点取父元素。
  function elementOf(node) {
    return node && (node.nodeType === 1 ? node : node.parentElement);
  }

  // 图内（SVG 的 <text> 或 foreignObject 里的 HTML）与 mermaid 源码块内不插 <mark>：
  // SVG 文字里插入 HTML 元素会让文字消失，源码块在图渲染后整块被替换。
  function inUnmarkable(node) {
    var el = elementOf(node);
    return !!(el && (el.closest('svg') || el.closest('pre > code.language-mermaid')));
  }

  // 收集 Range 覆盖的文本分段 [{node, start, end}]（只读，不改 DOM）。
  // 端点落在元素上时由 intersectsNode 归到文本节点：终点在下一个块元素偏移 0 时，那个块里的文字不相交。
  // 跳过纯空白分段（块与块之间的换行节点）与不可插 <mark> 的节点。
  function textSegments(range) {
    var root = range.commonAncestorContainer;
    if (root.nodeType === 3) root = root.parentNode;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var out = [], node;
    while ((node = walker.nextNode())) {
      if (!range.intersectsNode(node)) continue;
      var start = node === range.startContainer ? range.startOffset : 0;
      var end = node === range.endContainer ? range.endOffset : node.data.length;
      if (end <= start || !/\S/.test(node.data.slice(start, end)) || inUnmarkable(node)) continue;
      out.push({ node: node, start: start, end: end });
    }
    return out;
  }

  // kind: 'note'（暂存意见，data-note）| 'saved'（已落盘意见，data-saved）；key 一律是 id（或无 id 时的序位键）。
  // 同一条意见的每个分段各包一个 <mark>，共用 key。至少包上一段即返回 true。
  function wrapRange(range, key, kind) {
    var segs = textSegments(range);   // 先收集清单，再统一改写 DOM
    var marks = [];
    segs.forEach(function (seg) {
      var target = seg.node;
      // 同一文本节点内：先按止点切分，再按起点切分
      if (seg.end < target.data.length) target.splitText(seg.end);
      if (seg.start > 0) target = target.splitText(seg.start);
      var mark = document.createElement('mark');
      if (kind === 'saved') {
        mark.className = 'sdflow-saved-hl';
        mark.dataset.saved = key;
      } else {
        mark.className = 'sdflow-hl';
        mark.dataset.note = key;
      }
      target.parentNode.insertBefore(mark, target);
      mark.appendChild(target);
      marks.push(mark);
    });
    if (kind === 'saved' && marks.length > 1) {
      marks.forEach(function (m, i) {
        m.dataset.seg = i === 0 ? 'first' : i === marks.length - 1 ? 'last' : 'mid';
      });
    }
    return marks.length > 0;
  }

  // 以 dataset 比对取 mark，不把 id 拼进选择器。
  function marksOf(kind, key) {
    var cls = kind === 'saved' ? 'mark.sdflow-saved-hl' : 'mark.sdflow-hl';
    return Array.prototype.filter.call(document.querySelectorAll(cls), function (m) {
      return (kind === 'saved' ? m.dataset.saved : m.dataset.note) === key;
    });
  }

  function unwrapMarks(key) {
    marksOf('note', key).forEach(function (m) {
      var parent = m.parentNode;
      while (m.firstChild) parent.insertBefore(m.firstChild, m);
      parent.removeChild(m);
      parent.normalize();
    });
  }

  // 给每条意见定位并（能的话）高亮；status: 'hl' | 'unmarked'（已定位但没高亮上）| 'orphan'（对不上）。
  // 找不到起点时：图内划选的意见、或原文在正文出现多处而前后文无法区分，都记 unmarked，不记 orphan。
  function unlocatedStatus(body, note) {
    if (!body) return 'orphan';
    return note.inFigure || (note.quote && body.textContent.indexOf(note.quote) >= 0) ? 'unmarked' : 'orphan';
  }

  // 定位一条意见并（能的话）高亮，返回 status。图内划选的意见不在正文里找：
  // 原文与正文某处同名时会被高亮到那里（RVP-13）。
  function highlightOne(note, key, kind) {
    var body = docBodyByLabel(note.doc);
    if (body && note.inFigure) return 'unmarked';
    var idx = body ? locateNote(body.textContent, note) : -1;
    if (idx < 0) return unlocatedStatus(body, note);
    var range = rangeAt(body, idx, note.quote.length);
    return range && wrapRange(range, key, kind) ? 'hl' : 'unmarked';
  }

  function restoreHighlights() {
    // 与已落盘版重复的暂存意见不在 view 里，不显示也不高亮。
    view.forEach(function (v) { v.note.status = highlightOne(v.note, v.note.id, 'note'); });
    savedNotes.forEach(function (sn) { sn.status = highlightOne(sn, sn.key, 'saved'); });
  }

  // ── 选区暂存与「写意见」按钮 ─────────────────────────────────────────────────
  var annotateBtn = document.createElement('button');
  annotateBtn.type = 'button';
  annotateBtn.id = 'sdflow-annotate';
  annotateBtn.textContent = '写意见';
  annotateBtn.hidden = true;
  document.body.appendChild(annotateBtn);

  function bodyOf(node) {
    var el = elementOf(node);
    return el && el.closest ? el.closest('#main .doc-body') : null;
  }

  function captureSelection() {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
    var r = sel.getRangeAt(0);
    var body = bodyOf(r.startContainer);
    if (!body) return null;
    var endBody = bodyOf(r.endContainer);
    if (!endBody) {
      // 终点在正文之外时，只接受三击末段的形态：终点紧接本正文之后（两者之间只有空白），
      // 此时收到本正文末尾。其余（拖到侧栏、页尾两节、其他文档标题，或途经其他 .doc-body）一律拒绝。
      var tail = document.createRange();
      tail.setStart(body, body.childNodes.length);
      tail.setEnd(r.endContainer, r.endOffset);
      // 「写意见」按钮可能停靠在正文之后，它的文字不算选区跨过的内容。
      var gap = tail.cloneContents();
      var dock = gap.querySelector ? gap.querySelector('#sdflow-annotate') : null;
      if (dock) dock.parentNode.removeChild(dock);
      if (/\S/.test(gap.textContent)) return null;
      r = r.cloneRange();
      r.setEnd(body, body.childNodes.length);
    } else if (endBody !== body) {
      return null;
    }
    var full = r.toString();
    if (!/\S/.test(full)) return null;
    var pre = document.createRange();
    pre.selectNodeContents(body);
    pre.setEnd(r.startContainer, r.startOffset);
    var start = pre.toString().length;
    var ctx = selectionContext(body.textContent, start, full.length);
    var heading = '';
    Array.prototype.forEach.call(body.querySelectorAll('h1, h2, h3, h4, h5, h6'), function (h) {
      if (r.comparePoint(h, 0) === -1) heading = h.textContent.replace(/\s+/g, ' ').trim();
    });
    var startEl = elementOf(r.startContainer);
    return {
      range: r.cloneRange(),
      body: body,
      start: start,
      truncated: ctx.quote.length < full.length,
      section: body.parentNode,
      inFigure: !!(startEl && startEl.closest('svg')),
      docLabel: body.parentNode.getAttribute('data-label'),
      heading: heading,
      quote: ctx.quote,
      before: ctx.before,
      after: ctx.after,
    };
  }

  // 按钮紧随选区所在的文档节之后，划选后按 Tab 先到它，不必越过后面所有文档里的链接（D14）。
  // 按钮正拿着焦点时不挪：挪动会让它失焦。
  function dockAnnotateBtn() {
    if (!pending || !pending.section || document.activeElement === annotateBtn) return;
    if (annotateBtn.previousElementSibling !== pending.section) {
      pending.section.parentNode.insertBefore(annotateBtn, pending.section.nextSibling);
    }
  }

  function placeAnnotateBtn() {
    if (!pending || annotateBtn.hidden) return;
    var rects = pending.range.getClientRects();
    var rect = rects.length ? rects[rects.length - 1] : pending.range.getBoundingClientRect();
    var top = rect.bottom + 8;
    if (top > window.innerHeight - 44) top = rect.top - 44;
    // 选区滚出视口时按钮钉在视口边缘，仍然点得到。
    top = Math.min(Math.max(8, top), window.innerHeight - 44);
    var left = Math.min(Math.max(8, rect.right), window.innerWidth - 100);
    annotateBtn.style.top = top + 'px';
    annotateBtn.style.left = left + 'px';
  }

  function hideAnnotateBtn() { annotateBtn.hidden = true; }

  document.addEventListener('selectionchange', function () {
    if (dlg || copyState) return;
    var cap = captureSelection();
    if (cap) {
      pending = cap;
      dockAnnotateBtn();
      annotateBtn.hidden = false;
      placeAnnotateBtn();
    } else if (document.activeElement !== annotateBtn) {
      pending = null;
      hideAnnotateBtn();
    }
  });
  window.addEventListener('scroll', placeAnnotateBtn, { passive: true });
  window.addEventListener('resize', placeAnnotateBtn);
  // 点按钮会让选区丢失：mousedown 阻止默认行为，选区保持，pending 里也另存了 Range。
  annotateBtn.addEventListener('mousedown', function (e) { e.preventDefault(); });
  annotateBtn.addEventListener('click', function () { if (pending) openDialog('new', null, annotateBtn); });

  // ── 对话框：意见输入 ────────────────────────────────────────────────────────
  function makeButton(text, cls) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'sdflow-btn' + (cls ? ' ' + cls : '');
    b.textContent = text;
    return b;
  }

  function makeOverlay(id, titleText) {
    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.hidden = true;
    var panel = document.createElement('div');
    panel.className = 'dlg-panel';
    panel.id = id;
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'true');
    panel.setAttribute('aria-labelledby', id + '-title');
    var h = document.createElement('h2');
    h.id = id + '-title';
    h.textContent = titleText;
    panel.appendChild(h);
    overlay.appendChild(panel);
    document.body.appendChild(overlay);
    return { overlay: overlay, panel: panel, title: h };
  }

  var noteDlg = makeOverlay('sdflow-note-dialog', '写意见');
  var dlgQuote = document.createElement('blockquote');
  dlgQuote.className = 'dlg-quote';
  var dlgLabel = document.createElement('label');
  dlgLabel.htmlFor = 'sdflow-note-text';
  dlgLabel.className = 'sr-only';
  dlgLabel.textContent = '意见';
  var dlgText = document.createElement('textarea');
  dlgText.id = 'sdflow-note-text';
  dlgText.rows = 5;
  dlgText.setAttribute('aria-describedby', 'sdflow-note-error');
  // 空意见的错误写进这个 role=status 节点（平时为空），读屏才会读出来。
  var dlgError = document.createElement('p');
  dlgError.className = 'dlg-error';
  dlgError.id = 'sdflow-note-error';
  dlgError.setAttribute('role', 'status');
  var dlgHint = document.createElement('p');
  dlgHint.className = 'dlg-hint';
  var HINT = 'Ctrl/⌘ + Enter 保存，Esc 取消';
  dlgHint.textContent = HINT;
  var dlgActions = document.createElement('div');
  dlgActions.className = 'dlg-actions';
  var dlgCancel = makeButton('取消');
  var dlgSave = makeButton('保存', 'primary');
  dlgActions.appendChild(dlgCancel);
  dlgActions.appendChild(dlgSave);
  [dlgQuote, dlgLabel, dlgText, dlgError, dlgHint, dlgActions].forEach(function (el) { noteDlg.panel.appendChild(el); });

  function focusables(panel) {
    return Array.prototype.filter.call(panel.querySelectorAll('textarea, button'), function (el) {
      return !el.disabled && !el.hidden && el.getClientRects().length > 0;
    });
  }

  // 对话框打开期间在 document 上统一处理键盘：焦点落到页面主体时 Esc 也能关闭、Tab 能回到对话框内。
  // 输入法组字期间的按键留给输入法；对话框关闭后这里什么都不做。
  document.addEventListener('keydown', function (e) {
    var open = copyState ? copyDlg : dlg ? noteDlg : null;
    if (!open) return;
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      if (open === copyDlg) closeCopy(); else closeDialog(true);
      return;
    }
    if (e.key !== 'Tab') return;
    var items = focusables(open.panel);
    if (!items.length) return;
    var first = items[0], last = items[items.length - 1];
    if (!open.panel.contains(document.activeElement)) { e.preventDefault(); first.focus(); return; }
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  // 正文区域平时不带 tabindex：带了的话，在正文里按下鼠标划选会让 main 拿到焦点，
  // 之后的 Tab 从正文开头起算而不是从选区起算，「写意见」按钮紧随文档节之后就白放了（D14）。
  // 只在要把焦点移到正文时临时设上，失焦即撤掉。
  var mainEl = document.getElementById('main');
  function focusMain() {
    mainEl.tabIndex = -1;
    mainEl.focus();
  }
  mainEl.addEventListener('blur', function () { mainEl.removeAttribute('tabindex'); });
  // 「跳到正文」照旧把焦点移进正文（默认的锚点跳转只滚动，main 不带 tabindex 时拿不到焦点）。
  document.querySelector('.skip-link').addEventListener('click', focusMain);

  // 关闭对话框后还原焦点：目标仍在文档中、未隐藏、未禁用、有布局盒才聚焦，否则聚焦正文区域。
  function restoreFocus(target) {
    if (target && document.body.contains(target) && !target.hidden && !target.disabled && target.getClientRects().length > 0) {
      target.focus();
      return;
    }
    focusMain();
  }

  function clearNoteError() {
    dlgError.textContent = '';
    dlgText.removeAttribute('aria-invalid');
  }

  function openDialog(mode, note, opener) {
    dlg = { mode: mode, noteId: note ? note.id : null, returnFocus: opener || document.activeElement };
    noteDlg.title.textContent = mode === 'edit' ? '编辑意见' : '写意见';
    dlgQuote.textContent = (note ? note.quote : pending.quote).slice(0, 300);
    dlgText.value = note ? note.comment : '';
    clearNoteError();
    dlgHint.textContent = HINT;
    noteDlg.overlay.hidden = false;
    dlgText.focus();
  }

  function closeDialog(restoreSelection) {
    var d = dlg;
    if (!d) return;
    dlg = null;
    noteDlg.overlay.hidden = true;
    if (d.mode === 'new' && restoreSelection && pending) {
      // 取消：把选区放回去，「写意见」按钮仍在。
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(pending.range);
      annotateBtn.hidden = false;
      placeAnnotateBtn();
    }
    restoreFocus(d.returnFocus);
  }

  function saveDialog() {
    var comment = dlgText.value.trim();
    if (!comment) {
      dlgError.textContent = '意见不能为空';
      dlgText.setAttribute('aria-invalid', 'true');
      dlgText.focus();
      return;
    }
    var d = dlg;
    if (d.mode === 'edit') {
      var existing = findNote(d.noteId);
      if (existing) { existing.comment = comment; existing.copied = false; }
      saveState();
      renderNotes();
      // 「编辑」按钮随意见栏重建；改回与已落盘版相同的意见不再显示，找不到就交给 restoreFocus 落到正文。
      var item = noteItemOf('note', d.noteId);
      d.returnFocus = item ? item.querySelector('.edit-btn') : null;
      closeDialog(false);
      return;
    }
    var note = {
      id: newNoteId(), n: state.next++, doc: pending.docLabel, heading: pending.heading, quote: pending.quote,
      before: pending.before, after: pending.after, comment: comment, copied: false, inFigure: !!pending.inFigure,
    };
    window.getSelection().removeAllRanges();
    // 引用被截断时按截断后的引用重算范围，与重新加载后按引用定位的范围一致。
    var saveRange = pending.truncated ? rangeAt(pending.body, pending.start, pending.quote.length) : null;
    note.status = wrapRange(saveRange || pending.range, note.id, 'note') ? 'hl' : 'unmarked';
    state.notes.push(note);
    saveState();
    renderNotes();
    pending = null;
    hideAnnotateBtn();
    d.returnFocus = null;
    closeDialog(false);
  }

  dlgSave.addEventListener('click', saveDialog);
  dlgCancel.addEventListener('click', function () { closeDialog(true); });
  dlgText.addEventListener('input', clearNoteError);
  dlgText.addEventListener('keydown', function (e) {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveDialog(); }
  });

  // ── 意见栏 ──────────────────────────────────────────────────────────────────
  var notesRoot = document.getElementById('sdflow-notes');
  var notesTitle = document.createElement('h2');
  notesTitle.tabIndex = -1;
  var notesEmpty = document.createElement('p');
  notesEmpty.className = 'notes-empty';
  notesEmpty.textContent = '在正文划选文字，点「写意见」。';
  var notesActions = document.createElement('div');
  notesActions.className = 'notes-actions';
  var copyBtn = makeButton('复制意见', 'primary');
  copyBtn.id = 'sdflow-copy-new';
  var copyAllBtn = makeButton('复制全部');
  copyAllBtn.id = 'sdflow-copy-all';
  var clearBtn = makeButton('清空');
  clearBtn.id = 'sdflow-clear';
  [copyBtn, copyAllBtn, clearBtn].forEach(function (b) { notesActions.appendChild(b); });
  var notesList = document.createElement('ol');
  notesList.className = 'notes-list';
  // 「定位」找不到高亮时在这里提示（role=status，平时为空）。
  var jumpHint = document.createElement('p');
  jumpHint.className = 'notes-hint';
  jumpHint.id = 'sdflow-jump-hint';
  jumpHint.setAttribute('role', 'status');
  var savedWarn = document.createElement('p');
  savedWarn.className = 'notes-empty';
  savedWarn.setAttribute('role', 'status');
  savedWarn.textContent = '已落盘意见无法读取';
  savedWarn.hidden = !savedUnreadable;
  var savedGroup = document.createElement('section');
  savedGroup.className = 'saved-group';
  savedGroup.setAttribute('aria-label', '已落盘意见');
  savedGroup.hidden = true;
  var savedTitle = document.createElement('h3');
  var savedList = document.createElement('ol');
  savedList.className = 'notes-list';
  savedGroup.appendChild(savedTitle);
  savedGroup.appendChild(savedList);
  [notesTitle, notesEmpty, notesActions, jumpHint, notesList, savedWarn, savedGroup].forEach(function (el) { notesRoot.appendChild(el); });
  notesRoot.hidden = false;
  document.body.classList.add('has-notes');

  var STATUS_TEXT = { orphan: '原文已对不上，仅列出', unmarked: '未在正文高亮' };
  var SAVED_STATUS_TEXT = { orphan: '原文已变', unmarked: '未在正文高亮' };
  var clearTimer = null;

  function appendBadge(parent, text) {
    var b = document.createElement('span');
    b.className = 'note-badge';
    b.textContent = text;
    parent.appendChild(b);
  }

  // 暂存意见被合并掉（不显示）时，它在正文的暂存高亮一并拿掉，不留无主的 mark。
  // 编辑回与已落盘版相同、或改过的意见复制后（RVP-19）都会从列表消失。
  function refreshView() {
    view = mergeNotes(state.notes, savedNotes);
    var shown = Object.create(null);
    view.forEach(function (v) { shown[v.note.id] = true; });
    state.notes.forEach(function (n) { if (!shown[n.id]) unwrapMarks(n.id); });
  }

  // 已落盘意见的处理行：取该意见 id 对应的处置；处置块读不出来显示「无法读取」。
  function dispositionLine(sn) {
    if (!dispositionsParsed.ok) return '处理：无法读取';
    return '处理：' + dispositionText(sn.id ? dispositionsParsed.map[sn.id] : null);
  }

  // 意见栏的一条。o = {className, kind, key, head, badges, quote, comment, disposition?, buttons}；
  // kind 即 dataset 名（'note' → data-note，'saved' → data-saved）。内容一律 textContent，没有按钮时不建按钮行。
  function buildNoteItem(o) {
    var li = document.createElement('li');
    li.className = o.className;
    li.dataset[o.kind] = o.key;
    var head = document.createElement('div');
    head.className = 'note-head';
    head.textContent = o.head;
    o.badges.forEach(function (text) { appendBadge(head, text); });
    var quote = document.createElement('div');
    quote.className = 'note-quote';
    quote.textContent = o.quote;
    var comment = document.createElement('div');
    comment.className = 'note-comment';
    comment.textContent = o.comment;
    [head, quote, comment].forEach(function (el) { li.appendChild(el); });
    if (o.disposition) {
      var disposition = document.createElement('div');
      disposition.className = 'note-disposition';
      disposition.textContent = o.disposition;
      li.appendChild(disposition);
    }
    if (o.buttons.length) {
      var actions = document.createElement('div');
      actions.className = 'note-actions';
      o.buttons.forEach(function (b) { actions.appendChild(b); });
      li.appendChild(actions);
    }
    return li;
  }

  // 「定位」只给找得到位置的意见（已高亮，或已定位但没高亮上）。
  function jumpButtons(kind, key, status) {
    if (status !== 'hl' && status !== 'unmarked') return [];
    var jump = makeButton('定位');
    jump.classList.add('jump-btn');
    jump.addEventListener('click', function () { jumpTo(kind, key); });
    return [jump];
  }

  // 意见栏里某条意见的 <li>：以 dataset 比对取（同 marksOf，不把 id 拼进选择器）；找不到返回 null。
  function noteItemOf(kind, key) {
    var list = kind === 'saved' ? savedList : notesList;
    return Array.prototype.filter.call(list.children, function (li) { return li.dataset[kind] === key; })[0] || null;
  }

  // 暂存或已落盘意见有变动后调用：重算 view 再重画意见栏。
  function renderNotes() {
    refreshView();
    drawNotes();
  }

  function drawNotes() {
    // 重置「清空」确认态前先撤掉旧定时器，否则它会把之后新进入的确认态提前还原。
    clearTimeout(clearTimer);
    jumpHint.textContent = '';
    var total = view.length;
    var fresh = view.filter(function (v) { return !v.note.copied; }).length;
    notesTitle.textContent = '意见（' + total + '）';
    notesEmpty.hidden = total > 0;
    copyBtn.disabled = fresh === 0;
    copyBtn.textContent = '复制意见' + (total ? '（' + fresh + '）' : '');
    copyBtn.title = total === 0 ? '还没有意见' : fresh === 0 ? '没有未复制的意见，可用「复制全部」' : '';
    copyAllBtn.disabled = total === 0;
    clearBtn.disabled = state.notes.length === 0;
    clearBtn.textContent = '清空';
    clearBtn.dataset.armed = '';
    while (notesList.firstChild) notesList.removeChild(notesList.firstChild);
    view.forEach(function (v) {
      var note = v.note;
      var badges = [];
      if (v.modified) badges.push('已修改，未落盘');
      if (note.copied) badges.push('已复制');
      if (STATUS_TEXT[note.status]) badges.push(STATUS_TEXT[note.status]);
      var edit = makeButton('编辑');
      edit.classList.add('edit-btn');
      edit.addEventListener('click', function () { openDialog('edit', note, edit); });
      var del = makeButton('删除');
      del.classList.add('del-btn');
      del.addEventListener('click', function () { deleteNote(note.id); });
      notesList.appendChild(buildNoteItem({
        className: 'note-item', kind: 'note', key: note.id,
        head: '#' + note.n + ' ' + note.doc + (note.heading ? ' › ' + note.heading : ''),
        badges: badges, quote: note.quote, comment: note.comment,
        buttons: jumpButtons('note', note.id, note.status).concat([edit, del]),
      }));
    });
    renderSaved();
  }

  // 已落盘意见：只读；0 条时整组不显示。
  function renderSaved() {
    while (savedList.firstChild) savedList.removeChild(savedList.firstChild);
    savedGroup.hidden = savedNotes.length === 0;
    savedTitle.textContent = '已落盘意见（' + savedNotes.length + '）';
    savedNotes.forEach(function (sn, k) {
      var where = sn.path ? sn.path + (sn.line ? ':' + sn.line : '') : sn.doc;
      savedList.appendChild(buildNoteItem({
        className: 'note-item saved-item', kind: 'saved', key: sn.key,
        head: '已落盘 ' + (k + 1) + ' ' + where + (sn.heading ? ' › ' + sn.heading : ''),
        badges: SAVED_STATUS_TEXT[sn.status] ? [SAVED_STATUS_TEXT[sn.status]] : [],
        quote: sn.quote, comment: sn.comment, disposition: dispositionLine(sn),
        buttons: jumpButtons('saved', sn.key, sn.status),
      }));
    });
  }

  function findSaved(key) {
    for (var i = 0; i < savedNotes.length; i++) if (savedNotes[i].key === key) return savedNotes[i];
    return null;
  }

  function jumpTo(kind, key) {
    var marks = marksOf(kind, key);
    if (marks.length) {
      jumpHint.textContent = '';
      marks[0].scrollIntoView({ block: 'center' });
      marks.forEach(function (m) { m.classList.add('flash'); });
      setTimeout(function () { marks.forEach(function (m) { m.classList.remove('flash'); }); }, 1200);
      return;
    }
    // 没有高亮可去（图内划选、原文出现多处，或高亮已被拿掉）：滚到所在文档并提示。
    var note = kind === 'saved' ? findSaved(key) : findNote(key);
    if (!note) return;
    var body = docBodyByLabel(note.doc);
    if (body) body.parentNode.scrollIntoView({ block: 'start' });
    if (note.status === 'hl') {
      // 记着已高亮、mark 却不在了：改标「未在正文高亮」，重画后焦点放回这条的「定位」。
      note.status = 'unmarked';
      renderNotes();
      var item = noteItemOf(kind, key);
      var btn = item && item.querySelector('.jump-btn');
      if (btn) btn.focus();
    }
    jumpHint.textContent = '未在正文高亮';
  }

  function deleteNote(id) {
    unwrapMarks(id);
    state.notes = state.notes.filter(function (x) { return x.id !== id; });
    saveState();
    renderNotes();
    notesTitle.focus();
  }

  // 清空要点两次：第一次变成「再点一次确认」，4 秒内不点就还原。
  clearBtn.addEventListener('click', function () {
    if (clearBtn.dataset.armed === '1') {
      clearTimeout(clearTimer);
      state.notes.forEach(function (x) { unwrapMarks(x.id); });
      state.notes = [];
      saveState();
      renderNotes();
      notesTitle.focus();
      return;
    }
    clearBtn.dataset.armed = '1';
    clearBtn.textContent = '再点一次确认清空';
    clearTimer = setTimeout(function () { clearBtn.dataset.armed = ''; clearBtn.textContent = '清空'; }, 4000);
  });

  // ── 复制 ────────────────────────────────────────────────────────────────────
  var copyDlg = makeOverlay('sdflow-copy-dialog', '复制意见');
  var copyStatus = document.createElement('p');
  copyStatus.className = 'dlg-hint';
  copyStatus.id = 'sdflow-copy-status';
  copyStatus.setAttribute('role', 'status');
  var copyLabel = document.createElement('label');
  copyLabel.htmlFor = 'sdflow-copy-text';
  copyLabel.className = 'sr-only';
  copyLabel.textContent = '意见全文';
  var copyText = document.createElement('textarea');
  copyText.id = 'sdflow-copy-text';
  copyText.rows = 14;
  copyText.readOnly = true;
  var copyActions = document.createElement('div');
  copyActions.className = 'dlg-actions';
  var markBtn = makeButton('标记为已复制');
  markBtn.hidden = true;
  var copyClose = makeButton('关闭', 'primary');
  copyClose.id = 'sdflow-copy-close';
  copyActions.appendChild(markBtn);
  copyActions.appendChild(copyClose);
  [copyStatus, copyLabel, copyText, copyActions].forEach(function (el) { copyDlg.panel.appendChild(el); });

  function markCopied(ids) {
    state.notes.forEach(function (n) { if (ids.indexOf(n.id) >= 0) n.copied = true; });
    saveState();
    renderNotes();
  }

  // 依次试 Clipboard API、execCommand；resolve(true/false)，不抛错。
  function autoCopy(text) {
    return new Promise(function (resolve) {
      function legacy() {
        var ok = false;
        try { copyText.focus(); copyText.select(); ok = document.execCommand('copy'); } catch (e) { ok = false; }
        resolve(ok);
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { resolve(true); }, legacy);
          return;
        }
      } catch (e) { /* 落到 execCommand */ }
      legacy();
    });
  }

  function doCopy(all, opener) {
    var picked = view.map(function (v) { return v.note; })
      .filter(function (n) { return all || !n.copied; });
    if (!picked.length) return;
    var text = buildCopyText({
      title: document.title,
      pathname: location.pathname,
      copiedAt: formatLocalTime(new Date()),
      notes: picked.map(function (n) {
        var out = storable(n);
        out.path = pathOfDoc(n.doc);
        return out;
      }),
    });
    var ids = picked.map(function (n) { return n.id; });
    var myState = { ids: ids, returnFocus: opener };
    copyState = myState;
    copyText.value = text;
    copyStatus.textContent = '正在复制…';
    markBtn.hidden = true;
    copyDlg.overlay.hidden = false;
    copyText.focus();
    copyText.select();
    autoCopy(text).then(function (ok) {
      // 剪贴板已写入就标已复制，不论对话框此时是否还是本次那个
      if (ok) markCopied(ids);
      if (copyState !== myState) return;
      copyText.focus();
      copyText.select();
      if (ok) {
        copyStatus.textContent = '已复制 ' + ids.length + ' 条意见到剪贴板。若粘贴不出来，可在下面已全选的文本框里手动复制。';
      } else {
        copyStatus.textContent = '自动复制失败。下面的全文已全选，请按 Ctrl/⌘ + C 手动复制。';
        markBtn.hidden = false;
      }
    });
  }

  function closeCopy() {
    var c = copyState;
    if (!c) return;
    copyState = null;
    copyDlg.overlay.hidden = true;
    restoreFocus(c.returnFocus);
  }

  copyBtn.addEventListener('click', function () { doCopy(false, copyBtn); });
  copyAllBtn.addEventListener('click', function () { doCopy(true, copyAllBtn); });
  copyClose.addEventListener('click', closeCopy);
  markBtn.addEventListener('click', function () {
    if (copyState) markCopied(copyState.ids);
    markBtn.hidden = true;
    copyStatus.textContent = '已标记为已复制。';
  });

  drawRecordsSection();
  drawRevisionsSection();

  loadState();
  refreshView();
  restoreHighlights();
  drawNotes();
})();
</script>
</body>
</html>
