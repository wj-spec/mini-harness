<script type="application/json" id="sdflow-docs">[{"label":"roadmap","path":"openspec/roadmaps/simplify-workbench-experience/roadmap.md","text":"# 工作台体验简化：实施路线图\n\n\u003e v5 · 2026-11-13 · 阶段 1–4 与 5.A/5.B 工程实现完成；真人体验缺口见各阶段验证记录\n\u003e\n\u003e [整体设计](design.md) · [任务记录](task-log.md)\n\n## 概览\n\n推荐顺序：**回执降噪 → 配置契约与最小模板 → 功能区指引 → 应用内模型设置 → 任务限制与高级设置**。\n\n阶段 1、2 分别交付回执分层和配置基础；用户授权继续后，阶段 3 已细化并实现功能区指引。阶段 4 复用安装目录 .env，已细化保存、检测、应用与恢复边界；阶段 5 已拆为单段限制、goal 总预算、MCP 生命周期三批，5.A/5.B 已交付。\n\n| 阶段 | 成果 | 当前状态 |\n| --- | --- | --- |\n| 0 基础整理 | 胖猫形象、产品 README、简化启动与模型向导已有工作区成果 | 复用；证据见既有里程碑 |\n| 1 回执分层 | 日常对话安静，修改和异常清楚可查 | 代码与工程验证完成；真人体验待确认 |\n| 2 配置契约 | 最小示例真实可用，高级项有去处 | 工程实现与验证完成；真人/API/冷安装缺口已记录 |\n| 3 功能区指引 | 首次任务和常见情境有明确下一步 | 工程实现与验证完成；真人终端体验待确认 |\n| 4 模型设置 | 应用内配置模型，来源与生效范围可见 | 工程交付；真实服务与真人终端体验缺口另列 |\n| 5 任务与高级设置 | 单段限制、统一入口与高级状态 | 5.A/5.B 工程完成；5.C 待实施 |\n\n阶段 0 不重新申报实施完成；现有 UX 路线图的待验收事项继续由 [MILESTONES](../../../docs/MILESTONES.md) 管理。工程验证与真人验收分别记录；用户明确授权可继续下一阶段，未完成的体验项继续保留，不把未来功能作为当前能力宣传。\n\n## 阶段 1 · 回执分层与一致的结果展示\n\n### 前置条件\n\n- [x] 将用户认可的本方案范围写入阶段 1 change，不扩展为整个工作台重构。\n- [x] 核对结果事件、计划验收、账本、状态区、检视、历史与 attach 消费路径。\n- [x] 补齐当前每轮回执场景的可复现用例，明确任务与续段边界。\n\n### 目标\n\n用实际结果和异常优先级决定可见信息，完整保留证据；同一结果在各区域表达一致（见 design.md 决策 1、决策 2）。\n\n### 子任务\n\n- [x] 1.A 交付完整的条件回执能力：结构化结果契约、兼容读取、任务收束、紧凑摘要、证据入口、各消费者一致性及回归验证。作为一个内聚 change，不把“协议改完但 UI 仍猜字符串”当作独立交付。\n\n### 验收标准\n\n- [x] 普通问答与成功只读任务：独立终态回执卡新增数量为 0；答案仍可读，证据仍可达。\n- [x] 修改后通过、未验证、失败、过期验证：文案准确且默认紧凑，无未经证据支持的“需求完成”。\n- [x] 任意命令无文件 diff 时不被自动判断为无副作用；未知影响、工具拒绝、审计异常有可见说明。\n- [x] 取消、错误、预算停止说明原因及已保留影响；等待审批/输入不冒充任务完成。\n- [x] 自动续段不重复产生终态卡；任务最终摘要保留前段影响，重放/重连不重复追加结果。\n- [x] 历史与实时结果归属正确；原始证据可展开；旧数据不从文案推断新的强结论。\n- [x] 对话、状态区、检视与 attach 的结果一致；通过相关 Python/Ink 测试及实际 PTY。\n- [x] ./run_tests.sh 通过；提交前如有新增行为变更仍需重跑。\n- [ ] 真实终端连续问答、修改、失败、恢复旅程由用户体验确认；自动 PTY 已通过，不替代真人体验。\n\n### 交付物\n\n一个可独立运行的回执优化版本、结构化契约及兼容说明、场景验证记录、里程碑与任务日志更新。\n\n工程证据与待人工体验清单见 [阶段 1 验证记录](../../changes/implement-simplify-workbench-experience-p1/verification.md)。\n\n## 阶段 2 · 配置契约与最小配置入口\n\n### 前置条件\n\n- [x] 阶段 1 工程已交付；真人体验项保留，用户已明确授权继续阶段 2。\n- [x] 盘点 .env.example、Config.from_env、模型请求及各运行入口，列出声明与消费不一致项。\n- [x] 保留现有启动配置的环境覆盖和安全保存测试基线。\n\n### 目标\n\n首次启动只呈现必要连接信息；每个保留配置都真实有效，高级与测试参数可查，不改变旧入口的隐式行为（见 design.md 决策 3、决策 4）。\n\n### 子任务\n\n- [x] 2.A 交付真实可用的配置分层：配置契约清单、最小 .env.example、高级/开发说明、无效示例处理、向导和帮助入口同步、启动回归。应用内设置不混入本 change。\n\n### 验收标准\n\n- [x] 新目录首次启动：Demo 无 Key 可用；默认服务仅填写 Key；自定义服务可填写地址与模型名。\n- [x] 默认模板只包含模型连接与明确可选的代理信息，用户无需理解预算、审计、MCP 或 benchmark。\n- [x] 从模板移出的每项有明确去向；清单包含默认值、解析和消费位置、作用域、生效时点、状态和测试依据。\n- [x] VIBE_LLM_MAX_OUTPUT_TOKENS 不再作为有效能力误导用户；若未接入则移除示例并记录未支持。\n- [x] 高级配置和开发/测试配置分开；保护机制默认不被关闭，实验能力不默认启用。\n- [x] CLI/环境覆盖规则、Key 隐藏输入、文件权限、原子保存、取消及失败保留行为通过回归；日志与文档没有真实凭据。\n- [x] run_ink.sh / run_vibe.sh 的环境行为未静默改变；README、USAGE 和配置示例一致。\n- [x] 提交前 ./run_tests.sh 通过，启动 smoke 和新用户配置旅程可复现；真实 API/平台覆盖缺口明确列出。\n\n### 交付物\n\n最小环境模板、配置契约清单、高级配置与开发配置说明、启动验证记录和相应文档导航。\n\n工程证据与未实测范围见 [阶段 2 验证记录](../../changes/implement-simplify-workbench-experience-p2/verification.md)。\n\n## 阶段 3 · 功能区与情境指引\n\n### 前置条件\n\n- [x] 阶段 1、2 工程已交付；用户授权继续，既有真人体验缺口继续保留。\n- [x] 核对首页、命令菜单、审批、计划、检视和任务入口；Ctrl+T 无现有应用内冲突。\n- [x] 复用独立面板与底部一行，明确最小终端为 32×12。\n\n### 目标\n\n让用户理解对话、计划进度、检视结果、任务会话、配置帮助，并找到当前需要的下一步；指引可关闭，不打断工作。\n\n### 子任务\n\n- [x] 3.A 实现五区指引、情境提示与可关闭/重开入口，接入真实功能和首页示例，覆盖布局、草稿、阅读、审批与回归验证。\n\n### 验收标准\n\n- [x] Ctrl+T、/guide 和宽屏可点击入口主动打开；没有自动弹出的教程。\n- [x] 主区不增加行数；提示可通过 /guide off 关闭、/guide on 恢复，作用域明确为当前工作台实例。\n- [x] 示例只填空闲状态的空草稿，不自动发送；已有中文草稿、光标及阅读位置返回后保留。\n- [x] 新审批到来自动收起指引，不发送决定；运行控制和计划验收提示继续优先。\n- [x] 未提供的能力不显示操作按钮；模型配置指向真实的 ./start.sh --configure。\n- [x] 键盘、鼠标、滚动与 32×12、80×24、120×40 布局通过测试。\n- [x] Python/Ink 全量及真实 PTY Demo 通过；失败回归及修复记录保留。\n- [ ] 用户在常用终端确认指引可发现性、中文阅读和连续工作手感；自动 PTY 不代替真人确认。\n\n### 交付物\n\n五区指引与情境提示、草稿示例、使用说明、阶段实施包及[验证记录](../../changes/implement-simplify-workbench-experience-p3/verification.md)。应用内模型编辑和提示偏好持久化未在本阶段实现。\n\n## 阶段 4 · 应用内模型配置\n\n### 前置条件\n\n- [x] 阶段 2 已核对模型配置消费链，阶段 3 已提供配置帮助入口；用户授权继续。\n- [x] 保存沿用安装目录 .env，高级入口仍不隐式加载文件；不引入平行存储。\n- [x] 区分普通 OpenAI 兼容、Demo、自定义 provider、额外审计和后台连接。\n\n### 目标\n\n在工作台内查看来源、编辑模型与 Key、显式检测、保存或空闲应用；配置变更不悄悄影响正在运行及恢复的任务。\n\n### 子任务\n\n- [x] 4.A 配置共享读写与来源、审批保存、显式检测、空闲应用、恢复快照核对，以及 Ink 编辑器与回归。\n\n### 验收标准\n\n- [x] /model 与配置帮助均可进入；32×12 至 120×40 可用，返回保留原对话草稿。\n- [x] Key 隐藏且不回填；不进入回执、审批参数、审计或快照。更换服务需重新填写 Key。\n- [x] 保存通过 ApprovalGate、检查文件版本、原子写入与 0600 权限；失败不改变当前客户端。\n- [x] 检测显式确认可能计费，只发固定最小请求，不携带工作区/会话；错误正文不外显。\n- [x] 普通 OpenAI 兼容连接空闲应用，主模型与摘要器同步；CLI/环境覆盖优先，运行中仅查看/编辑。\n- [x] Demo、自定义 provider、额外审计需保存后重启；后台进程不热切换。\n- [x] 新记录包含非敏感模型快照；不匹配时阻止原任务续做并提示原服务/模型/代理。旧记录缺失快照时明确提示兼容边界。\n- [x] Python/Ink 全量、三尺寸面板与真实 PTY 保存→返回草稿→审批任务通过。\n- [ ] 用户常用终端的真实服务连接、实际模型切换与恢复体验确认；本轮未使用真实 Key 或付费请求。\n\n### 交付物\n\n共享模型配置模块、应用内模型面板、协议与恢复检查、[使用说明](../../../docs/USAGE.md#应用内模型设置)和[验证记录](../../changes/implement-simplify-workbench-experience-p4/verification.md)。检测只证明最小请求成功，模型能力与预算不自动推断。\n\n## 阶段 5 · 任务限制与高级设置\n\n### 前置条件\n\n- [x] 阶段 4 的共享配置读写、来源和审批机制可复用。\n- [x] 核对单段运行、task/goal 续段、独立探索与后台进程的作用域。\n- [x] 权限面板复用现有能力；MCP 重连与 goal 总预算另拆批次，避免混合生命周期。\n\n### 目标\n\n用统一入口查看并调整任务默认限制，保持运行中和续做任务的限制稳定；高级能力按实际可安全生效的范围逐步接入。\n\n### 子任务\n\n- [x] 5.A /settings 统一入口与四项单段限制：数字编辑、来源、审批保存、空闲应用、续做快照、模型/权限导航和高级状态。\n- [x] 5.B goal 总预算：设置分组、审批保存/空闲应用、任务不可变预算、前后台续段门、恢复累计账本与旧记录迁移。\n- [x] 5.C 首批：前台原配置重载、审批断开、失败保留旧连接、清理重试与自动回归；[行为与边界](../../../docs/specs/mcp-lifecycle.md)。\n- [ ] 5.C MCP 生命周期与高级编辑：先验证启动、断连、重连失败回退与后台作用域；沙箱、通知继续明确重启边界。\n\n### 验收标准\n\n- [x] /settings 与配置指引可进入；键盘和紧凑布局可用，返回保留对话草稿，子面板返回保留设置编辑。\n- [x] 步数/token 为整数；时长大于 0；其余 0 表示不限；费用显示单价依赖和估算边界。\n- [x] 保存只更新四项限制，经过审批、版本复核和原子写入；应用不写文件且遵守 CLI/环境覆盖。\n- [x] 运行中只读和编辑可用，变更互斥；新任务采用新默认，/resume 和 task/goal 续段使用原快照。\n- [x] 缺快照明确提示启动时限制；损坏快照阻止执行；运行结束或异常恢复 Agent 字段。\n- [x] MCP、沙箱、通知只输出必要状态，不泄露外部参数、环境和 webhook；没有未经验证的热切换。\n- [x] Python/Ink 全量与隔离配置的真实 PTY 旅程通过，证据见下。\n- [x] 5.B 前后台共享预算快照，达到总上限后手动恢复不重置；真实 worker 和 PTY 通过。\n- [ ] 5.C 实施前补齐具体生命周期契约与验收证据；阶段 5 整体仍未完成。\n- [ ] 用户在常用终端确认连续工作手感；真实远程模型、MCP 和跨平台行为不由本轮 fake PTY 代替。\n\n### 交付物\n\n设置中心、限制配置模块、trace 快照与兼容恢复、[使用说明](../../../docs/USAGE.md#应用内任务限制与设置中心)、[5.A 验证记录](../../changes/implement-simplify-workbench-experience-p5/verification.md)。5.A 与 5.B 分别实施；目标分组、不可变预算和恢复证据见 [5.B 验证记录](../../changes/implement-simplify-workbench-experience-p5b/verification.md)，5.C 待实施。\n\n## 依赖与后续变更\n\n阶段 1 → 阶段 2 → 阶段 3 → 阶段 4 → 阶段 5 是推荐交付顺序；技术上阶段 2 不依赖回执协议，模型设置依赖阶段 2，后续高级设置依赖阶段 4。\n\n| 近期阶段 | 建议 change 名 | 设计依据 |\n| --- | --- | --- |\n| 1 | implement-simplify-workbench-experience-p1 | design.md 决策 1、2 |\n| 2 | implement-simplify-workbench-experience-p2 | design.md 决策 3、4 |\n| 3 | implement-simplify-workbench-experience-p3 | design.md 功能区与情境指引 |\n| 4 | implement-simplify-workbench-experience-p4 | design.md 决策 3、4 |\n| 5.A | implement-simplify-workbench-experience-p5 | 阶段 5 单段限制与快照契约 |\n| 5.B | implement-simplify-workbench-experience-p5b | 目标预算与前后台续段契约 |\n\n阶段 1–4 各有一个内聚子任务，均已建立对应实施 change、spec 和测试记录；阶段 5.A 已建立 implement-simplify-workbench-experience-p5 并交付；5.B 已建立 implement-simplify-workbench-experience-p5b 并交付；5.C 尚未创建实施 change，任务数和工期未估算。远期补细若改变范围、承诺或验收标准，再评审更新设计，并记录到 task-log.md。\n"},{"label":"design","path":"openspec/roadmaps/simplify-workbench-experience/design.md","text":"# 工作台体验简化：整体设计\n\n\u003e v3 · 2026-11-13 · 状态：方案评审已恢复；阶段 1–4 工程实现完成，真人体验等缺口另列\n\u003e\n\u003e [实施路线图](roadmap.md) · [任务记录](task-log.md)\n\n## 需求与目标态\n\n### 痛点与受众\n\n面向首次试用开源项目的人，以及日常在 Ink 工作台中完成编码任务的人。当前重点仍是可靠、可理解的单 Agent 编码流程。\n\n用户明确反馈：每一轮 Agent 处理完都会出现一部分“本轮回执”，连续对话时形成重复干扰。此前讨论还涉及配置项过多、功能入口不易发现、启动和 LLM 配置门槛，以及 README 混入过多工程指标。\n\n本方案把这些问题连成一条使用路径：看懂项目 → 启动 → 配置模型 → 发出任务 → 审批操作 → 看懂结果 → 找到下一步。现有 Logo、README 和启动工作的成果作为基础保留，新增开发集中在回执、配置分层和功能指引。\n\n### 目标态与验收门槛\n\n| 用户目标 | 可验证的结果 | 验证入口 |\n| --- | --- | --- |\n| 对话连续 | 普通问答、成功只读任务不自动追加独立回执卡 | 阶段 1 场景矩阵 |\n| 重要结果可见 | 修改、失败、未验证、停止仍有清楚的结果与证据入口 | 阶段 1 场景矩阵 |\n| 最小配置可启动 | Demo 不需要 Key；默认模型只填写 Key；自定义服务提供地址与模型名 | 阶段 2 新用户旅程 |\n| 配置确实有效 | 示例中的每个配置可追溯到解析、消费、默认值、作用域与生效时间 | 阶段 2 配置契约清单 |\n| 知道功能在哪里 | 初次任务能发现输入、审批、结果详情和帮助入口，无强制教程 | 阶段 3 实测后细化 |\n| 启动后可调整 | 设置能说明当前值来源、修改范围、生效时间；运行中的任务不被意外改配置 | 阶段 4、5 细化后验收 |\n\n不凭空设置满意度、转化率或“减少 80% 噪声”等数字指标。近期以确定场景、事件计数、自动化断言和真实终端体验验收；体验结论由用户实际使用确认。\n\n### 范围与非目标\n\n方案初稿只编写规划文档；用户批准后已启动阶段 1。整体实施覆盖上述路径，按独立成果分期交付，不把所有内容塞入一次改动。\n\n- 暂不引入 Web/桌面第二套界面；Ink 足以支撑本次目标。出现终端无法承载的明确核心任务时再讨论。\n- 暂不扩展多 Agent、长期记忆或云端账号系统；当单 Agent 的使用反馈证明需要时，回到长期路线图评估。\n- 暂不建设遥测平台；现有测试、回放、PTY 和人工体验可验证本次行为。需要跨用户量化研究时再提出独立方案。\n- 不重做既有权限系统，不降低 ApprovalGate、完成守卫或审计保护；复用现有机制，补上易懂的呈现和配置入口。\n- 近期不承诺跨平台安装发布。现有启动工作尚未验证的 Linux、真实 API 与无 uv 全新安装仍作为已知验证缺口保留。\n\n## 1. 现状与本次边界\n\n### 1.1 已有基础与事实\n\n以下是工作区现状，不代表本规划实施完成，也不覆盖既有里程碑中的人工验收：\n\n| 部分 | 已有基础 | 本计划新增内容 |\n| --- | --- | --- |\n| 形象 | 胖脸金渐层像素猫及相关渲染调整 | 沿用，不再次重画 |\n| 开源入口 | README 已按产品用途、启动和文档入口整理；有贡献指南和文档目录 | 保持首页简洁，把高级配置导向专门文档 |\n| 启动 | start.sh、模型配置向导、doctor、免 Key Demo 已有工作区实现和验证记录 | 精简默认模板，明确高级配置路径 |\n| 配置 | .env.example 仍混合模型、预算、审计、MCP、测试及基准参数 | 配置契约盘点、分层、后续应用内设置 |\n| 工作台 | 已有审批、计划、检视、任务与会话等区域 | 提高发现性，统一结果和引导 |\n| 回执 | 每轮结束会生成文本，前端从文本推断显示标题 | 结构化结果、条件展示、任务级收束 |\n\n当前进度和证据仍以 [MILESTONES](../../../docs/MILESTONES.md) 为准；长期方向见 [建设方向](../../../docs/roadmap.md)。本包不替代 [既有工作台 UX 路线图](../improve-workbench-ux/roadmap.md) 的 P1–P10，也不把其尚未完成的验收改为通过。新回执复用其 P2/P6，功能指引复用 P5/P8，设置复用 P9。\n\n### 1.2 可复核的代码锚点\n\n- core/task/state.py：classify_task、completion_decision、delivery_receipt。任务分类有文本启发式；回执包含运行、验收、变更、验证与审计信息。\n- tui/src/workbench.tsx：noticePresentation 根据“[运行结束]”“已验证”等字符串选择“本轮回执 / 验收通过 / 验收未通过”。\n- tui/src/agent-status.tsx：lastVerified 另行驱动状态显示。\n- app/runtime/agent.py：_complete_run、_finish 产生运行收尾结果；app/stdio.py 还涉及计划验收结果。\n- tui/src/view-state.ts、tui/src/sidebar/verification-content.ts、app/session/evidence.py：结果保存、检视与证据查询。\n- core/task/rounds.py：已有轮次账本，应优先复用身份和证据。\n- app/config.py 与 .env.example：VIBE_LLM_MAX_OUTPUT_TOKENS 目前仅出现在示例及配置字段，未找到环境解析和请求消费链。不能把该项作为已生效能力介绍。\n- /autonomy、/permissions 已有能力；/mcp 当前以查看为主。应用内模型选择与预算编辑属于待开发能力。\n\n## 2. 目标结构与职责\n\n~~~text\n运行事实、变更账本、验证与计划验收\n              ↓\n       结构化结果快照\n              ↓\n       展示决策与中文文案\n       ↙       ↓       ↘\n  对话摘要   状态区域   详情/历史\n\n启动配置 + 环境变量 + 用户设置\n              ↓\n     来源解析与作用域校验\n              ↓\n       新任务配置快照\n~~~\n\n继续使用 Python 后端与 React/Ink。core/ 保持纯标准库和既有分域，只描述运行事实与判定；app/ 负责模型、配置、持久化与协议适配；tui/ 负责展示和交互。不把中文文案或界面折叠逻辑下沉到核心。\n\n结果采用可版本化的结构字段，复用现有 session/task/run/segment 身份，不新建第二套事件数据库。字段形状在阶段 1 spec 中确定，至少区分：执行终态、观察到的效果、验证状态、计划验收状态、停止原因、证据引用和待处理动作。展示结论是这些事实的派生结果。\n\n## 3. 设计决策\n\n### 决策 1：按实际结果决定回执层级\n\n选择“默认安静、重要结果就近呈现、完整证据可展开”。不继续每轮固定生成同权重卡片，也不简单删除所有回执。前者会持续打扰，后者使用户丢失修改和失败信息。\n\n以下规则从高到低应用；错误、风险和待处理事项不能被“没有文件变化”覆盖：\n\n| 场景 | 默认展示 | 详情与下一步 |\n| --- | --- | --- |\n| 等待审批或输入 | 继续显示当前待办，不显示终态回执 | 现有审批/输入入口 |\n| 失败、中断、取消、预算停止 | 简短原因及已保留的影响；不声称需求完成 | 证据、查看变更、适用的恢复动作 |\n| 有失败验证、审计异常或无法确认的执行效果 | 简短提醒 | 失败项、证据及可执行建议 |\n| 修改了文件，验证通过且覆盖最后修改 | 回复下方紧凑结果条，如“修改 3 个文件 · 检查通过” | 查看变更 / 验证详情 |\n| 修改了文件，未验证或验证已过期 | 紧凑提醒，如“修改 3 个文件 · 尚未验证” | 查看变更 / 可用的检查入口 |\n| 无文件变化，但执行了有外部效果的命令/工具 | 显示操作结果或“影响待核对” | 工具证据；不自动归类成只读成功 |\n| 普通问答、成功且无异常的只读任务 | 只保留回答 | 保留可发现的证据入口，不追加独立卡片 |\n\n“验证通过”仅说明指定检查的结果及覆盖范围，不能直接改称“需求已完成”。运行结束、命令成功、环境验证、计划验收和用户认可各自保留。\n\n判断依据优先使用工具元数据、账本与审计。任意 shell 命令不因文件 diff 为空便认定无副作用；证据不足时保守显示“影响待核对”。不靠 classify_task 的问答/行动分类决定是否隐藏异常。\n\n代价是需要梳理协议与多个展示消费者；收益是减少重复、避免错误的成功感。优先保证重要信息完整，其次减少常规干扰。回滚可以恢复展示策略，不删除历史证据。\n\n### 决策 2：共享结构化事实，按任务边界收束\n\n停止用自然语言正则作为新结果的状态来源。回答正文可以自由表达，紧凑摘要、状态区和检视区消费同一份结构事实及一致的判定规则。\n\n同一任务的自动续段只更新进度；在任务最终结束或需要用户介入时呈现结果。内部 run/segment 仍逐段保存完整证据。新用户消息形成的新任务不与上一任务混并。\n\n聚合结果必须保留前段修改、失败与后续修复关系：新的成功只有明确覆盖相关变更/检查时才能消除旧警告。回放、重连、前后台接入使用既有身份去重；不能按文案相同或“最后一条结果”误合并。\n\n旧记录缺少结构字段时提供折叠的原始运行记录；不从“已验证”等字串推断新的强结论。历史中隐藏的证据依然可检索、可展开。迁移采用新增字段和兼容读取，具体协议版本与能力协商在实施 spec 锁定。\n\n三镜比较：系统层面，结构化方案增加协议迁移成本，文本过滤短期更小但保留多源判定；用户层面，前者减少重复和误导，后者只能减轻表面噪声；开发循环层面，共享事实与展示函数需要初期回归投入，但减少以后逐处修改文案和正则的成本。优先事实一致，其次低干扰，再控制实现复杂度。\n\n代价是需要覆盖实时、历史和 attach 三类路径。替代方案“只改标题/过滤字符串”成本低，但仍会出现多个区域结论不一致，不能解决根因。\n\n### 决策 3：配置先确保真实，再减少首次暴露\n\n默认 .env.example 只保留初次连接模型需要的项目：Key、服务地址、模型名，以及有明确说明的可选代理开关。默认服务只需填写 Key；Demo 不需要这些配置。使用向导不要求用户先理解模板。\n\n其余配置转为有目录、默认值和适用场景的高级指南；测试/评测项进入开发文档，不再堆在新手入口。\n\n| 配置类别 | 默认入口 | 启动后配置目标 | 生效原则 |\n| --- | --- | --- | --- |\n| Key、地址、模型、代理 | 启动向导 / 最小模板 | 设置 → 模型 | 空闲时验证并保存，下一任务采用 |\n| 自主权限、审批规则 | 安全默认值 | 设置 → 权限，复用 /autonomy 与 /permissions | 沿用既有即时策略/撤销语义，不能用快照绕过撤销 |\n| 步数、时间、token、费用、goal 上限 | 默认值 + 高级指南 | 设置 → 任务限制 | 创建任务时快照；旧任务保留原限制 |\n| 上下文窗口、输出上限 | 经过验证的模型能力/高级配置 | 模型高级设置 | 不把 1M 作为所有模型的事实；未知能力清楚标注 |\n| MCP 服务 | 专门配置文件与指南 | 设置 → 外部工具 | 空闲时重建连接，失败不替换可用配置 |\n| 沙箱及网络范围 | 高级配置 | 高级设置 | 下一任务或明确要求重启；不得暗中放宽运行中权限 |\n| 完成守卫、环境审计、契约反查 | 默认开启 | 高级说明；必要时受控修改 | 不作为新手推荐关闭项 |\n| LLM 审计、通知、验收重试/超时、日志上限 | 高级指南 | 后续高级设置 | 说明额外调用、网络发送或资源成本 |\n| fake 故障注入、时间偏移、benchmark 版本、调试路径 | 开发/测试文档 | 不进入普通设置页 | 仅测试/诊断用途 |\n| 实验性委派、无人值守放宽 | 高级实验说明 | 后续另评估入口 | 不混进默认新用户流程 |\n\n逐项盘点“声明 → 解析 → 消费 → 测试 → 文档”。对 VIBE_LLM_MAX_OUTPUT_TOKENS，近期推荐移除无效用户入口并记录未支持；真正接入请求上限时再恢复说明，避免为了精简模板顺手扩张模型协议。\n\n替代方案“把所有环境变量搬进设置页”会放大无效选项和认知负担。先核实契约、再按场景提供设置，用户更容易知道哪些值得改。\n\n### 决策 4：统一设置来源，明确生效边界\n\n不增加一份与现有权限/MCP/profile 存储互相覆盖的平行配置。阶段 4 已盘点并选择复用安装目录 .env；共享读写在 app/runtime/model_config.py，不新增用户/工作区平行设置。\n\n普通非安全配置的推荐优先级：显式 CLI → 进程环境 → 本次明确选择 → 已保存的工作区/用户设置 → 安装目录 .env → 默认值；阶段 4 实际采用 CLI → 进程环境 → 本次明确应用 → 安装目录 .env → 默认值；未引入工作区/用户配置层。设置页显示最终来源，被 CLI/环境遮蔽时明确提示，不能保存后假装已经生效。安全权限仍遵守 ApprovalGate 及其收紧、撤销、profile 约束，不能用通用优先级绕过。\n\n既有 start.sh 自动读取安装目录 .env；高级 run_ink.sh / run_vibe.sh 当前使用进程环境。阶段 2 保持该行为并说明；阶段 4 若统一入口，必须单列兼容与迁移测试，不能静默改变脚本/CI。\n\nKey 隐藏输入、脱敏展示，不进入事件、回执、配置快照或导出；快照仅保留必要的非敏感模型参数与凭据引用。保存通过 ApprovalGate、采用原子写入；失败保留当前生效配置和未保存编辑。连接检测由用户显式触发，提示可能发起模型服务请求，检测失败与保存行为分开说明。\n\n运行中允许查看、编辑草稿，不替换当前模型客户端/工具集合。阶段 4 支持普通 OpenAI 兼容连接空闲应用；Demo、自定义 provider、额外审计客户端明确要求重启，后台 worker 保持原配置。重开旧任务保留其快照；缺失模型或凭据时要求选择恢复方案，不偷偷使用新的默认值。权限撤销依现有策略即时生效。\n\n系统上采用任务快照比热切换更易隔离状态；用户需要理解生效边界，但能预测任务使用哪份设置；开发上复用存储、统一解析比复制配置源更易验证。优先运行可靠与来源透明，详细迁移取舍在阶段 4 spec 锁定。\n\n代价是需要让配置页说明“已保存”和“已生效”的区别；它比热切换所有运行资源更可理解、容易测试。\n\n### 决策 5：指引跟随任务场景出现\n\n采用一次可关闭的初次提示、区域说明和就近提示，不加入强制多步教程或抢焦点弹窗。\n\n五个区域按用户意图解释：\n\n| 区域 | 用户要做的事 | 指引内容 |\n| --- | --- | --- |\n| 对话 | 描述需求、补充或纠正任务 | 输入、发送、运行中补充 |\n| 计划/进度 | 看 Agent 准备做什么、正在做什么 | 审阅计划、当前步骤、继续/停止 |\n| 检视 | 核对做了什么 | 变更、验证、工具证据 |\n| 任务/会话 | 找回之前的工作 | 切换、恢复、查看后台任务 |\n| 设置/帮助 | 调整使用方式 | 模型、权限、任务限制、命令帮助 |\n\n首次入口可提供“了解项目 / 修改代码 / 审查变更”。选择后仅填入草稿，由用户审阅发送；已有草稿不覆盖。指引关闭后能从帮助重开，普通使用不反复出现。\n\n每条情境提示只表达“当前情况、对你的影响、一个下一步”。例如模型未配置引导打开模型设置；等待审批解释此次操作；检查失败指向失败详情。未实现的设置入口不伪装成可点击功能。\n\n复用现有键盘导航与帮助注册，先盘点快捷键冲突再确定按键，不提前承诺新快捷键。窄终端、滚动阅读、历史回放时不抢焦点或强制跳到底部。熟练用户可关闭引导。\n\n替代方案“首页列满命令”一次暴露过多信息；“只做首次教程”无法帮助用户处理后续具体情境。因此选择轻量首用入口与持续的就近提示。\n\n## 4. 验证、风险与实施边界\n\n阶段 1 的测试矩阵至少包含：问答、只读成功、修改后通过、未验证、验证后再次修改、检查失败、无改动但有命令效果、工具拒绝、错误/取消/预算终止、等待审批、自动续段、历史重放、前后台接入、不同任务并发呈现。工具拒绝若使请求无法完成，必须有可见说明，即使 Agent 后续生成了正常文本。\n\n先补行为测试再改实现。按影响范围运行 Python/Ink 测试；提交前运行 ./run_tests.sh，并用 ./run_ink.sh --fake 和实际 Ink/Python PTY 验证；涉及模型请求和配置时增加显式授权的真实 API smoke，未运行应写明。最终交付包含真实终端人工体验结果，不用测试数量代替体验结论。\n\n重要风险：\n- 隐藏过度：以异常优先和保守的未知效果处理兜底。\n- 多处结论漂移：结构化快照与消费者一致性测试。\n- 旧记录误判：只展示原始证据，不补造成功结论。\n- 续段遗漏前次影响：任务聚合需保留证据来源与覆盖关系。\n- 配置保存看似成功但未生效：显示来源、遮蔽原因和生效时间。\n- 指引造成干扰：不抢焦点、可关闭、可重开、不覆盖草稿。\n\n## 5. 开发前和后续阶段的待决事项\n\n下列是细化时需要查证的信息，不是本次要求用户补填的前置问卷：\n\n| 待决事项 | 推荐方向 | 再处理条件 |\n| --- | --- | --- |\n| 结果字段、版本与能力协商 | 扩展既有结果事件，保留旧消费者读取 | 阶段 1 spec，核对所有 producer/consumer |\n| 具体设置存储与优先级迁移 | 复用现有存储，统一来源解释 | 阶段 4 前完成配置流向盘点 |\n| 首次引导位置与终端适配 | 就近、可关闭，不新增固定大面板 | 阶段 3 前收集实际终端尺寸和键路 |\n| 模型能力来源 | 保守默认 + 用户明确覆盖，标注未知 | 阶段 4 模型设置细化 |\n| MCP 重连、沙箱及后台设置的支持范围 | 分能力渐进提供，清楚标明需重启 | 阶段 5 前验证运行生命周期 |\n"},{"label":"task-log","path":"openspec/roadmaps/simplify-workbench-experience/task-log.md","text":"# 工作台体验简化：任务记录\n\n\u003e 状态：ACTIVE；阶段 1–4 工程实现完成，真人体验待确认项保留\n\u003e\n\u003e [整体设计](design.md) · [实施路线图](roadmap.md)\n\n## Review 处置\n\n2026-11-13 恢复：strategy 与 plan-eng 均 completed，本轮前缀回执匹配；STRATEGY-01 ✅ 采纳，在 design 决策 2、4 补充系统/用户/开发循环比较与主次。plan-eng findings=[]。此前 voice-fallback 有效结果保留，runner=claude reason_code=runner-error，使用同宿主降级意见。历史故障记录保留，不再作为当前阻塞。\n\n本轮 result_ref：.vibe/roadmap-review/ux-recovery-20261113/{strategy,plan-eng}.md；requested_model=gpt-6.1-sol、requested_effort=medium，实际 effective_effort=unknown。\n\n以下为方案初稿时的历史故障，已由上述恢复记录解除：\n\n🔸 **当时未审待恢复**：strategy 请求失败并重试后仍返回 Bad Request；plan-eng 返回 Bad Request。未取得有效独立评审结果，不能标为通过。\n\nrunner=claude reason_code=runner-error：outside-voice 退出 1，报告 Not logged in；同宿主降级 fallback 已完成，首行前缀与本轮匹配，findings=[]；不是跨模型意见，也不替代失败的双镜。未登录故障不要求用户此刻处理，可在恢复评审工具后继续。\n\n恢复方式：在工具可用的会话中重跑 strategy 与 plan-eng，再逐条处置 findings。voice 已按技能完成同宿主降级，不把外部登录作为继续工作的必要条件。本轮不因评审故障修改用户系统配置，也不启动开发。\n\n## 2026-11-13\n\n### 阶段 0 / 整体方案起草\n\n- 对应 roadmap.md 概览：整理回执分层、配置契约、功能指引和应用内设置五阶段；前两阶段详细规划。\n- 需求来源：用户要求先给整体方案、记录文档，再着手开发；“本轮回执”问题已澄清为每轮结束重复出现。\n- 路由：存量项目体验演进；gate-0 的范围、痛点、目标、近期划分和备选取舍已有讨论及代码依据；无需求真实性未定/变现信号，选直接生成，新增拷问维度为空。开放源代码是分发背景，不是本轮商业化验证目标。\n- 新建 simplify-workbench-experience，保留 improve-workbench-ux 原规划与验收历史；重入扫描未发现待续 DRAFT 文档。\n- 本轮只落文档和文档评审，不修改运行行为、不提交、不启动实现。此前工作区改动保持原状。\n- 运行产物按用户 AGENTS.md 放入 .vibe/，覆盖技能默认的 .outside-voice 运行目录；正式文档放 openspec/roadmaps/。\n- 后续：用户阅读方案后，从阶段 1 开始细化 spec 和开发。\n- 耗时未计量，不填写推测时长。\n\n### 评审派发记录\n\nrun_id=ux-plan-20261113；规则根=/Users/endless/.sdflow/workflow。\n模型解析本轮执行一次：host=codex；mid=gpt-6.1-sol / medium；voice=claude / opus（high）。Codex 通则承载为 not-carried，使用生成的前缀文件。\n\nprefix_path=.vibe/roadmap-review/ux-plan-20261113/prefix-principles.md；prefix_version=principles-b9a054bafa9c。双镜派发截止记录：2026-11-13 06:24 UTC（各自派发后 60 分钟上限）；voice timeout=300s，fallback 若触发则本轮预算 300s。Codex 闹钟任务 ID 不适用。\n\n| task_id | 角色 | 请求模型 / effort | 上下文模式 | result_ref | 状态 |\n| --- | --- | --- | --- | --- | --- |\n| strategy | 计划完整性与范围 | gpt-6.1-sol / medium | fork_turns=none，只读三件套 | .vibe/roadmap-review/ux-plan-20261113/strategy.md | failed：Bad Request（含一次重试） |\n| plan-eng | 工程可行性与跨域风险 | gpt-6.1-sol / medium | fork_turns=none，只读三件套 | .vibe/roadmap-review/ux-plan-20261113/plan-eng.md | failed：Bad Request |\n| voice | 独立模型意见 | claude opus / high | 同步净化 context | .vibe/roadmap-review/ux-plan-20261113/voice.md | failed：未登录，退出 1 |\n| voice-fallback | voice 失败时同宿主兜底 | gpt-6.1-sol / medium | fork_turns=none，只读 | .vibe/roadmap-review/ux-plan-20261113/voice-fallback.md | completed：findings=[]，本轮前缀回执匹配 |\n\n### 方案初稿收尾核对（历史状态）\n\n① 未通过：独立评审故障，包保持未审待恢复；结构检查只能证明 Review 处置小节存在且非空，不能证明评审已完成或每项已处置。\n\n② 通过：三件套链接互通；阶段 1、2 回指对应 design 决策；阶段 0 记录对应 roadmap 概览。\n\n③ 通过：三件套没有引用历史讨论存档。\n\n④ 不适用：直接生成路径，无历史讨论备忘、无全局 ADR/术语写入。后续待决事项在 design 第 5 节附触发条件。\n\n文档检查：3 份 Markdown 本地链接与围栏检查通过；git diff --check 通过。另生成可浏览评审页 review/roadmap-review.html，仍标记方案草案。本轮没有改产品行为，未运行产品测试；后续提交产品改动前仍需 ./run_tests.sh。未执行 git add / commit。\n\n评审参数说明：requested_effort=medium；fallback 的参数获接口接受且结果完成，effective_effort=unknown，未取得实际档位元数据。双镜失败无成功接受证据；未尝试猜测模型或 effort 回退。\n\n### 阶段 1 / 开始实施\n\n用户明确批准推进；新建 implement-simplify-workbench-experience-p1，分支 codex/receipt-ux-p1。已有未提交的 Logo、启动和 README 工作保留，本次不自动提交。评审四项当前结论：①通过（STRATEGY-01 已处置）②通过 ③通过 ④不适用；机械小节检查不等同逐项审查。\n\n### 阶段 1 / 工程交付\n\n- 已实现结构化 outcome 与同任务续段聚合、最终计划验收覆盖、轮次/检视持久化，以及 Ink 共享展示。普通问答静默，变更紧凑，异常可见，原始证据保留。\n- Python 全量 1987 passed / 4 skipped；末次字段校验后 outcome 与 core 边界 10/10；Ink build + 低并发全量 760/760。默认并发曾发生固定等待失败，独立复跑通过，原日志与处置保留。\n- 实际 PTY Demo 两次单键审批后写文件并展示紧凑结果，退出 0。OpenSpec strict 与 diff 检查通过。\n- [阶段 1 验证记录](../../changes/implement-simplify-workbench-experience-p1/verification.md)列出命令、日志、场景及限制。真人连续使用尚未确认，阶段 1 不标整体验收。阶段 2–5 未开始。\n- 继续保留已有工作区修改；未 commit、push 或归档。\n\n### 阶段 2 / 配置分层实施\n\n用户明确要求开始下一阶段；阶段 1 真人体验项继续保留，不作为阻塞本次配置整理的条件。新建 implement-simplify-workbench-experience-p2，复用当前工作区，不改用户 .env。\n\n已完成最小模板、默认服务只填 Key、用户/开发/契约三份配置文档；47 个原变量逐项核对。VIBE_LLM_MAX_OUTPUT_TOKENS 未接入，删除示例并纠正说明；goal 段数/时长的 0 不代表无限，文档按现行前后台行为解释。45 项专项测试和免 Key 真实 PTY Demo 通过，全量最终复验中。\n\n### 阶段 2 / 工程交付\n\n最终 Python 全量 1993 passed / 4 skipped；首轮文档锚点错误已修正并保留失败日志。专项 45 项与新目录 start.sh --demo 实际 PTY 通过，不请求付费 API、不创建 .env。OpenSpec strict、diff 和链接检查通过。未修改 Ink 源码，本轮未重复 Ink 全量；未把复用依赖的 Demo 当成冷安装验证。\n\n交付与限制见[阶段 2 验证记录](../../changes/implement-simplify-workbench-experience-p2/verification.md)。下一阶段是功能区与情境指引，尚未开始。本轮未提交、推送或归档。\n\n\n### 阶段 3 / 功能区与情境指引交付\n\n用户明确授权继续；复用当前工作区，建立 implement-simplify-workbench-experience-p3。核对现有按键与能力后使用 Ctrl+T；主区只复用一行提示，主动打开五区指引。阶段 1、2 的真人体验缺口保留。\n\n实现情境提示开关、只填空草稿的三类示例、已有计划/检视/任务/权限入口；能力缺失不提供动作，审批优先，返回保留中文草稿光标和阅读位置。关闭提示仅影响当前工作台实例；不扩展到配置持久化和模型编辑。\n\nPython 全量 1993 passed / 4 skipped；Ink 最终全量 771/771。首次 Ink 769 n\n### 阶段 5.C 首批 / MCP 连接管理\n\n2026-11-14，用户授权继续。先交付 /mcp reload、/mcp disconnect 和安全状态查询；候选连接全部成功后才替换，失败保留原连接与工具。取消和清理失败路径有回归，后台连接不变。JSON 配置仍在原文件编辑，应用内编辑器未交付，5.C 不标整体验收。证据见 [说明](../../../docs/specs/mcp-lifecycle.md)。\n"}]</script>

    try {
      localStorage.setItem(STORE_KEY + ':probe', '1');
    } catch (e) {
      showStorageWarning();
      return;
    } finally {
      try { localStorage.removeItem(STORE_KEY + ':probe'); } catch (e2) { /* 删不掉也不影响使用 */ }
    }
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (!data || !Array.isArray(data.notes)) return;
      var maxN = 0, repaired = false;
      data.notes.forEach(function (n) {
        if (!n || typeof n.quote !== 'string' || typeof n.comment !== 'string' || typeof n.n !== 'number') return;
        var id = n.id;
        if (!isNoteId(id)) { id = newNoteId(); repaired = true; }
        state.notes.push({
          id: id, n: n.n, doc: String(n.doc || ''), heading: String(n.heading || ''), quote: n.quote,
          before: String(n.before || ''), after: String(n.after || ''), comment: n.comment, copied: !!n.copied,
          inFigure: n.inFigure === true,
        });
        if (n.n > maxN) maxN = n.n;
      });
      state.next = Math.max(Number(data.next) || 1, maxN + 1);
      if (repaired) saveState();
    } catch (e) { /* 存档损坏：当作没有意见 */ }
  }

  function findNote(id) {
    for (var i = 0; i < state.notes.length; i++) if (state.notes[i].id === id) return state.notes[i];
    return null;
  }

  // ── 高亮：按文本节点分段包 <mark>，跨粗体、跨列表项的选区每段各包一个 ─────────────
  function docBodyByLabel(label) {
    var sections = document.querySelectorAll('section.doc');
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].getAttribute('data-label') === label) return sections[i].querySelector('.doc-body');
    }
    return null;
  }

  function rangeAt(root, start, length) {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var pos = 0, node, range = document.createRange(), startSet = false, end = start + length;
    while ((node = walker.nextNode())) {
      var len = node.data.length;
      if (!startSet && start < pos + len) { range.setStart(node, start - pos); startSet = true; }
      if (startSet && end <= pos + len) { range.setEnd(node, end - pos); return range; }
      pos += len;
    }
    return null;
  }

  // 节点本身是元素就取它，文本节点取父元素。
  function elementOf(node) {
    return node && (node.nodeType === 1 ? node : node.parentElement);
  }

  // 图内（SVG 的 <text> 或 foreignObject 里的 HTML）与 mermaid 源码块内不插 <mark>：
  // SVG 文字里插入 HTML 元素会让文字消失，源码块在图渲染后整块被替换。
  function inUnmarkable(node) {
    var el = elementOf(node);
    return !!(el && (el.closest('svg') || el.closest('pre > code.language-mermaid')));
  }

  // 收集 Range 覆盖的文本分段 [{node, start, end}]（只读，不改 DOM）。
  // 端点落在元素上时由 intersectsNode 归到文本节点：终点在下一个块元素偏移 0 时，那个块里的文字不相交。
  // 跳过纯空白分段（块与块之间的换行节点）与不可插 <mark> 的节点。
  function textSegments(range) {
    var root = range.commonAncestorContainer;
    if (root.nodeType === 3) root = root.parentNode;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var out = [], node;
    while ((node = walker.nextNode())) {
      if (!range.intersectsNode(node)) continue;
      var start = node === range.startContainer ? range.startOffset : 0;
      var end = node === range.endContainer ? range.endOffset : node.data.length;
      if (end <= start || !/\S/.test(node.data.slice(start, end)) || inUnmarkable(node)) continue;
      out.push({ node: node, start: start, end: end });
    }
    return out;
  }

  // kind: 'note'（暂存意见，data-note）| 'saved'（已落盘意见，data-saved）；key 一律是 id（或无 id 时的序位键）。
  // 同一条意见的每个分段各包一个 <mark>，共用 key。至少包上一段即返回 true。
  function wrapRange(range, key, kind) {
    var segs = textSegments(range);   // 先收集清单，再统一改写 DOM
    var marks = [];
    segs.forEach(function (seg) {
      var target = seg.node;
      // 同一文本节点内：先按止点切分，再按起点切分
      if (seg.end < target.data.length) target.splitText(seg.end);
      if (seg.start > 0) target = target.splitText(seg.start);
      var mark = document.createElement('mark');
      if (kind === 'saved') {
        mark.className = 'sdflow-saved-hl';
        mark.dataset.saved = key;
      } else {
        mark.className = 'sdflow-hl';
        mark.dataset.note = key;
      }
      target.parentNode.insertBefore(mark, target);
      mark.appendChild(target);
      marks.push(mark);
    });
    if (kind === 'saved' && marks.length > 1) {
      marks.forEach(function (m, i) {
        m.dataset.seg = i === 0 ? 'first' : i === marks.length - 1 ? 'last' : 'mid';
      });
    }
    return marks.length > 0;
  }

  // 以 dataset 比对取 mark，不把 id 拼进选择器。
  function marksOf(kind, key) {
    var cls = kind === 'saved' ? 'mark.sdflow-saved-hl' : 'mark.sdflow-hl';
    return Array.prototype.filter.call(document.querySelectorAll(cls), function (m) {
      return (kind === 'saved' ? m.dataset.saved : m.dataset.note) === key;
    });
  }

  function unwrapMarks(key) {
    marksOf('note', key).forEach(function (m) {
      var parent = m.parentNode;
      while (m.firstChild) parent.insertBefore(m.firstChild, m);
      parent.removeChild(m);
      parent.normalize();
    });
  }

  // 给每条意见定位并（能的话）高亮；status: 'hl' | 'unmarked'（已定位但没高亮上）| 'orphan'（对不上）。
  // 找不到起点时：图内划选的意见、或原文在正文出现多处而前后文无法区分，都记 unmarked，不记 orphan。
  function unlocatedStatus(body, note) {
    if (!body) return 'orphan';
    return note.inFigure || (note.quote && body.textContent.indexOf(note.quote) >= 0) ? 'unmarked' : 'orphan';
  }

  // 定位一条意见并（能的话）高亮，返回 status。图内划选的意见不在正文里找：
  // 原文与正文某处同名时会被高亮到那里（RVP-13）。
  function highlightOne(note, key, kind) {
    var body = docBodyByLabel(note.doc);
    if (body && note.inFigure) return 'unmarked';
    var idx = body ? locateNote(body.textContent, note) : -1;
    if (idx < 0) return unlocatedStatus(body, note);
    var range = rangeAt(body, idx, note.quote.length);
    return range && wrapRange(range, key, kind) ? 'hl' : 'unmarked';
  }

  function restoreHighlights() {
    // 与已落盘版重复的暂存意见不在 view 里，不显示也不高亮。
    view.forEach(function (v) { v.note.status = highlightOne(v.note, v.note.id, 'note'); });
    savedNotes.forEach(function (sn) { sn.status = highlightOne(sn, sn.key, 'saved'); });
  }

  // ── 选区暂存与「写意见」按钮 ─────────────────────────────────────────────────
  var annotateBtn = document.createElement('button');
  annotateBtn.type = 'button';
  annotateBtn.id = 'sdflow-annotate';
  annotateBtn.textContent = '写意见';
  annotateBtn.hidden = true;
  document.body.appendChild(annotateBtn);

  function bodyOf(node) {
    var el = elementOf(node);
    return el && el.closest ? el.closest('#main .doc-body') : null;
  }

  function captureSelection() {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
    var r = sel.getRangeAt(0);
    var body = bodyOf(r.startContainer);
    if (!body) return null;
    var endBody = bodyOf(r.endContainer);
    if (!endBody) {
      // 终点在正文之外时，只接受三击末段的形态：终点紧接本正文之后（两者之间只有空白），
      // 此时收到本正文末尾。其余（拖到侧栏、页尾两节、其他文档标题，或途经其他 .doc-body）一律拒绝。
      var tail = document.createRange();
      tail.setStart(body, body.childNodes.length);
      tail.setEnd(r.endContainer, r.endOffset);
      // 「写意见」按钮可能停靠在正文之后，它的文字不算选区跨过的内容。
      var gap = tail.cloneContents();
      var dock = gap.querySelector ? gap.querySelector('#sdflow-annotate') : null;
      if (dock) dock.parentNode.removeChild(dock);
      if (/\S/.test(gap.textContent)) return null;
      r = r.cloneRange();
      r.setEnd(body, body.childNodes.length);
    } else if (endBody !== body) {
      return null;
    }
    var full = r.toString();
    if (!/\S/.test(full)) return null;
    var pre = document.createRange();
    pre.selectNodeContents(body);
    pre.setEnd(r.startContainer, r.startOffset);
    var start = pre.toString().length;
    var ctx = selectionContext(body.textContent, start, full.length);
    var heading = '';
    Array.prototype.forEach.call(body.querySelectorAll('h1, h2, h3, h4, h5, h6'), function (h) {
      if (r.comparePoint(h, 0) === -1) heading = h.textContent.replace(/\s+/g, ' ').trim();
    });
    var startEl = elementOf(r.startContainer);
    return {
      range: r.cloneRange(),
      body: body,
      start: start,
      truncated: ctx.quote.length < full.length,
      section: body.parentNode,
      inFigure: !!(startEl && startEl.closest('svg')),
      docLabel: body.parentNode.getAttribute('data-label'),
      heading: heading,
      quote: ctx.quote,
      before: ctx.before,
      after: ctx.after,
    };
  }

  // 按钮紧随选区所在的文档节之后，划选后按 Tab 先到它，不必越过后面所有文档里的链接（D14）。
  // 按钮正拿着焦点时不挪：挪动会让它失焦。
  function dockAnnotateBtn() {
    if (!pending || !pending.section || document.activeElement === annotateBtn) return;
    if (annotateBtn.previousElementSibling !== pending.section) {
      pending.section.parentNode.insertBefore(annotateBtn, pending.section.nextSibling);
    }
  }

  function placeAnnotateBtn() {
    if (!pending || annotateBtn.hidden) return;
    var rects = pending.range.getClientRects();
    var rect = rects.length ? rects[rects.length - 1] : pending.range.getBoundingClientRect();
    var top = rect.bottom + 8;
    if (top > window.innerHeight - 44) top = rect.top - 44;
    // 选区滚出视口时按钮钉在视口边缘，仍然点得到。
    top = Math.min(Math.max(8, top), window.innerHeight - 44);
    var left = Math.min(Math.max(8, rect.right), window.innerWidth - 100);
    annotateBtn.style.top = top + 'px';
    annotateBtn.style.left = left + 'px';
  }

  function hideAnnotateBtn() { annotateBtn.hidden = true; }

  document.addEventListener('selectionchange', function () {
    if (dlg || copyState) return;
    var cap = captureSelection();
    if (cap) {
      pending = cap;
      dockAnnotateBtn();
      annotateBtn.hidden = false;
      placeAnnotateBtn();
    } else if (document.activeElement !== annotateBtn) {
      pending = null;
      hideAnnotateBtn();
    }
  });
  window.addEventListener('scroll', placeAnnotateBtn, { passive: true });
  window.addEventListener('resize', placeAnnotateBtn);
  // 点按钮会让选区丢失：mousedown 阻止默认行为，选区保持，pending 里也另存了 Range。
  annotateBtn.addEventListener('mousedown', function (e) { e.preventDefault(); });
  annotateBtn.addEventListener('click', function () { if (pending) openDialog('new', null, annotateBtn); });

  // ── 对话框：意见输入 ────────────────────────────────────────────────────────
  function makeButton(text, cls) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'sdflow-btn' + (cls ? ' ' + cls : '');
    b.textContent = text;
    return b;
  }

  function makeOverlay(id, titleText) {
    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.hidden = true;
    var panel = document.createElement('div');
    panel.className = 'dlg-panel';
    panel.id = id;
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'true');
    panel.setAttribute('aria-labelledby', id + '-title');
    var h = document.createElement('h2');
    h.id = id + '-title';
    h.textContent = titleText;
    panel.appendChild(h);
    overlay.appendChild(panel);
    document.body.appendChild(overlay);
    return { overlay: overlay, panel: panel, title: h };
  }

  var noteDlg = makeOverlay('sdflow-note-dialog', '写意见');
  var dlgQuote = document.createElement('blockquote');
  dlgQuote.className = 'dlg-quote';
  var dlgLabel = document.createElement('label');
  dlgLabel.htmlFor = 'sdflow-note-text';
  dlgLabel.className = 'sr-only';
  dlgLabel.textContent = '意见';
  var dlgText = document.createElement('textarea');
  dlgText.id = 'sdflow-note-text';
  dlgText.rows = 5;
  dlgText.setAttribute('aria-describedby', 'sdflow-note-error');
  // 空意见的错误写进这个 role=status 节点（平时为空），读屏才会读出来。
  var dlgError = document.createElement('p');
  dlgError.className = 'dlg-error';
  dlgError.id = 'sdflow-note-error';
  dlgError.setAttribute('role', 'status');
  var dlgHint = document.createElement('p');
  dlgHint.className = 'dlg-hint';
  var HINT = 'Ctrl/⌘ + Enter 保存，Esc 取消';
  dlgHint.textContent = HINT;
  var dlgActions = document.createElement('div');
  dlgActions.className = 'dlg-actions';
  var dlgCancel = makeButton('取消');
  var dlgSave = makeButton('保存', 'primary');
  dlgActions.appendChild(dlgCancel);
  dlgActions.appendChild(dlgSave);
  [dlgQuote, dlgLabel, dlgText, dlgError, dlgHint, dlgActions].forEach(function (el) { noteDlg.panel.appendChild(el); });

  function focusables(panel) {
    return Array.prototype.filter.call(panel.querySelectorAll('textarea, button'), function (el) {
      return !el.disabled && !el.hidden && el.getClientRects().length > 0;
    });
  }

  // 对话框打开期间在 document 上统一处理键盘：焦点落到页面主体时 Esc 也能关闭、Tab 能回到对话框内。
  // 输入法组字期间的按键留给输入法；对话框关闭后这里什么都不做。
  document.addEventListener('keydown', function (e) {
    var open = copyState ? copyDlg : dlg ? noteDlg : null;
    if (!open) return;
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      if (open === copyDlg) closeCopy(); else closeDialog(true);
      return;
    }
    if (e.key !== 'Tab') return;
    var items = focusables(open.panel);
    if (!items.length) return;
    var first = items[0], last = items[items.length - 1];
    if (!open.panel.contains(document.activeElement)) { e.preventDefault(); first.focus(); return; }
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  // 正文区域平时不带 tabindex：带了的话，在正文里按下鼠标划选会让 main 拿到焦点，
  // 之后的 Tab 从正文开头起算而不是从选区起算，「写意见」按钮紧随文档节之后就白放了（D14）。
  // 只在要把焦点移到正文时临时设上，失焦即撤掉。
  var mainEl = document.getElementById('main');
  function focusMain() {
    mainEl.tabIndex = -1;
    mainEl.focus();
  }
  mainEl.addEventListener('blur', function () { mainEl.removeAttribute('tabindex'); });
  // 「跳到正文」照旧把焦点移进正文（默认的锚点跳转只滚动，main 不带 tabindex 时拿不到焦点）。
  document.querySelector('.skip-link').addEventListener('click', focusMain);

  // 关闭对话框后还原焦点：目标仍在文档中、未隐藏、未禁用、有布局盒才聚焦，否则聚焦正文区域。
  function restoreFocus(target) {
    if (target && document.body.contains(target) && !target.hidden && !target.disabled && target.getClientRects().length > 0) {
      target.focus();
      return;
    }
    focusMain();
  }

  function clearNoteError() {
    dlgError.textContent = '';
    dlgText.removeAttribute('aria-invalid');
  }

  function openDialog(mode, note, opener) {
    dlg = { mode: mode, noteId: note ? note.id : null, returnFocus: opener || document.activeElement };
    noteDlg.title.textContent = mode === 'edit' ? '编辑意见' : '写意见';
    dlgQuote.textContent = (note ? note.quote : pending.quote).slice(0, 300);
    dlgText.value = note ? note.comment : '';
    clearNoteError();
    dlgHint.textContent = HINT;
    noteDlg.overlay.hidden = false;
    dlgText.focus();
  }

  function closeDialog(restoreSelection) {
    var d = dlg;
    if (!d) return;
    dlg = null;
    noteDlg.overlay.hidden = true;
    if (d.mode === 'new' && restoreSelection && pending) {
      // 取消：把选区放回去，「写意见」按钮仍在。
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(pending.range);
      annotateBtn.hidden = false;
      placeAnnotateBtn();
    }
    restoreFocus(d.returnFocus);
  }

  function saveDialog() {
    var comment = dlgText.value.trim();
    if (!comment) {
      dlgError.textContent = '意见不能为空';
      dlgText.setAttribute('aria-invalid', 'true');
      dlgText.focus();
      return;
    }
    var d = dlg;
    if (d.mode === 'edit') {
      var existing = findNote(d.noteId);
      if (existing) { existing.comment = comment; existing.copied = false; }
      saveState();
      renderNotes();
      // 「编辑」按钮随意见栏重建；改回与已落盘版相同的意见不再显示，找不到就交给 restoreFocus 落到正文。
      var item = noteItemOf('note', d.noteId);
      d.returnFocus = item ? item.querySelector('.edit-btn') : null;
      closeDialog(false);
      return;
    }
    var note = {
      id: newNoteId(), n: state.next++, doc: pending.docLabel, heading: pending.heading, quote: pending.quote,
      before: pending.before, after: pending.after, comment: comment, copied: false, inFigure: !!pending.inFigure,
    };
    window.getSelection().removeAllRanges();
    // 引用被截断时按截断后的引用重算范围，与重新加载后按引用定位的范围一致。
    var saveRange = pending.truncated ? rangeAt(pending.body, pending.start, pending.quote.length) : null;
    note.status = wrapRange(saveRange || pending.range, note.id, 'note') ? 'hl' : 'unmarked';
    state.notes.push(note);
    saveState();
    renderNotes();
    pending = null;
    hideAnnotateBtn();
    d.returnFocus = null;
    closeDialog(false);
  }

  dlgSave.addEventListener('click', saveDialog);
  dlgCancel.addEventListener('click', function () { closeDialog(true); });
  dlgText.addEventListener('input', clearNoteError);
  dlgText.addEventListener('keydown', function (e) {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveDialog(); }
  });

  // ── 意见栏 ──────────────────────────────────────────────────────────────────
  var notesRoot = document.getElementById('sdflow-notes');
  var notesTitle = document.createElement('h2');
  notesTitle.tabIndex = -1;
  var notesEmpty = document.createElement('p');
  notesEmpty.className = 'notes-empty';
  notesEmpty.textContent = '在正文划选文字，点「写意见」。';
  var notesActions = document.createElement('div');
  notesActions.className = 'notes-actions';
  var copyBtn = makeButton('复制意见', 'primary');
  copyBtn.id = 'sdflow-copy-new';
  var copyAllBtn = makeButton('复制全部');
  copyAllBtn.id = 'sdflow-copy-all';
  var clearBtn = makeButton('清空');
  clearBtn.id = 'sdflow-clear';
  [copyBtn, copyAllBtn, clearBtn].forEach(function (b) { notesActions.appendChild(b); });
  var notesList = document.createElement('ol');
  notesList.className = 'notes-list';
  // 「定位」找不到高亮时在这里提示（role=status，平时为空）。
  var jumpHint = document.createElement('p');
  jumpHint.className = 'notes-hint';
  jumpHint.id = 'sdflow-jump-hint';
  jumpHint.setAttribute('role', 'status');
  var savedWarn = document.createElement('p');
  savedWarn.className = 'notes-empty';
  savedWarn.setAttribute('role', 'status');
  savedWarn.textContent = '已落盘意见无法读取';
  savedWarn.hidden = !savedUnreadable;
  var savedGroup = document.createElement('section');
  savedGroup.className = 'saved-group';
  savedGroup.setAttribute('aria-label', '已落盘意见');
  savedGroup.hidden = true;
  var savedTitle = document.createElement('h3');
  var savedList = document.createElement('ol');
  savedList.className = 'notes-list';
  savedGroup.appendChild(savedTitle);
  savedGroup.appendChild(savedList);
  [notesTitle, notesEmpty, notesActions, jumpHint, notesList, savedWarn, savedGroup].forEach(function (el) { notesRoot.appendChild(el); });
  notesRoot.hidden = false;
  document.body.classList.add('has-notes');

  var STATUS_TEXT = { orphan: '原文已对不上，仅列出', unmarked: '未在正文高亮' };
  var SAVED_STATUS_TEXT = { orphan: '原文已变', unmarked: '未在正文高亮' };
  var clearTimer = null;

  function appendBadge(parent, text) {
    var b = document.createElement('span');
    b.className = 'note-badge';
    b.textContent = text;
    parent.appendChild(b);
  }

  // 暂存意见被合并掉（不显示）时，它在正文的暂存高亮一并拿掉，不留无主的 mark。
  // 编辑回与已落盘版相同、或改过的意见复制后（RVP-19）都会从列表消失。
  function refreshView() {
    view = mergeNotes(state.notes, savedNotes);
    var shown = Object.create(null);
    view.forEach(function (v) { shown[v.note.id] = true; });
    state.notes.forEach(function (n) { if (!shown[n.id]) unwrapMarks(n.id); });
  }

  // 已落盘意见的处理行：取该意见 id 对应的处置；处置块读不出来显示「无法读取」。
  function dispositionLine(sn) {
    if (!dispositionsParsed.ok) return '处理：无法读取';
    return '处理：' + dispositionText(sn.id ? dispositionsParsed.map[sn.id] : null);
  }

  // 意见栏的一条。o = {className, kind, key, head, badges, quote, comment, disposition?, buttons}；
  // kind 即 dataset 名（'note' → data-note，'saved' → data-saved）。内容一律 textContent，没有按钮时不建按钮行。
  function buildNoteItem(o) {
    var li = document.createElement('li');
    li.className = o.className;
    li.dataset[o.kind] = o.key;
    var head = document.createElement('div');
    head.className = 'note-head';
    head.textContent = o.head;
    o.badges.forEach(function (text) { appendBadge(head, text); });
    var quote = document.createElement('div');
    quote.className = 'note-quote';
    quote.textContent = o.quote;
    var comment = document.createElement('div');
    comment.className = 'note-comment';
    comment.textContent = o.comment;
    [head, quote, comment].forEach(function (el) { li.appendChild(el); });
    if (o.disposition) {
      var disposition = document.createElement('div');
      disposition.className = 'note-disposition';
      disposition.textContent = o.disposition;
      li.appendChild(disposition);
    }
    if (o.buttons.length) {
      var actions = document.createElement('div');
      actions.className = 'note-actions';
      o.buttons.forEach(function (b) { actions.appendChild(b); });
      li.appendChild(actions);
    }
    return li;
  }

  // 「定位」只给找得到位置的意见（已高亮，或已定位但没高亮上）。
  function jumpButtons(kind, key, status) {
    if (status !== 'hl' && status !== 'unmarked') return [];
    var jump = makeButton('定位');
    jump.classList.add('jump-btn');
    jump.addEventListener('click', function () { jumpTo(kind, key); });
    return [jump];
  }

  // 意见栏里某条意见的 <li>：以 dataset 比对取（同 marksOf，不把 id 拼进选择器）；找不到返回 null。
  function noteItemOf(kind, key) {
    var list = kind === 'saved' ? savedList : notesList;
    return Array.prototype.filter.call(list.children, function (li) { return li.dataset[kind] === key; })[0] || null;
  }

  // 暂存或已落盘意见有变动后调用：重算 view 再重画意见栏。
  function renderNotes() {
    refreshView();
    drawNotes();
  }

  function drawNotes() {
    // 重置「清空」确认态前先撤掉旧定时器，否则它会把之后新进入的确认态提前还原。
    clearTimeout(clearTimer);
    jumpHint.textContent = '';
    var total = view.length;
    var fresh = view.filter(function (v) { return !v.note.copied; }).length;
    notesTitle.textContent = '意见（' + total + '）';
    notesEmpty.hidden = total > 0;
    copyBtn.disabled = fresh === 0;
    copyBtn.textContent = '复制意见' + (total ? '（' + fresh + '）' : '');
    copyBtn.title = total === 0 ? '还没有意见' : fresh === 0 ? '没有未复制的意见，可用「复制全部」' : '';
    copyAllBtn.disabled = total === 0;
    clearBtn.disabled = state.notes.length === 0;
    clearBtn.textContent = '清空';
    clearBtn.dataset.armed = '';
    while (notesList.firstChild) notesList.removeChild(notesList.firstChild);
    view.forEach(function (v) {
      var note = v.note;
      var badges = [];
      if (v.modified) badges.push('已修改，未落盘');
      if (note.copied) badges.push('已复制');
      if (STATUS_TEXT[note.status]) badges.push(STATUS_TEXT[note.status]);
      var edit = makeButton('编辑');
      edit.classList.add('edit-btn');
      edit.addEventListener('click', function () { openDialog('edit', note, edit); });
      var del = makeButton('删除');
      del.classList.add('del-btn');
      del.addEventListener('click', function () { deleteNote(note.id); });
      notesList.appendChild(buildNoteItem({
        className: 'note-item', kind: 'note', key: note.id,
        head: '#' + note.n + ' ' + note.doc + (note.heading ? ' › ' + note.heading : ''),
        badges: badges, quote: note.quote, comment: note.comment,
        buttons: jumpButtons('note', note.id, note.status).concat([edit, del]),
      }));
    });
    renderSaved();
  }

  // 已落盘意见：只读；0 条时整组不显示。
  function renderSaved() {
    while (savedList.firstChild) savedList.removeChild(savedList.firstChild);
    savedGroup.hidden = savedNotes.length === 0;
    savedTitle.textContent = '已落盘意见（' + savedNotes.length + '）';
    savedNotes.forEach(function (sn, k) {
      var where = sn.path ? sn.path + (sn.line ? ':' + sn.line : '') : sn.doc;
      savedList.appendChild(buildNoteItem({
        className: 'note-item saved-item', kind: 'saved', key: sn.key,
        head: '已落盘 ' + (k + 1) + ' ' + where + (sn.heading ? ' › ' + sn.heading : ''),
        badges: SAVED_STATUS_TEXT[sn.status] ? [SAVED_STATUS_TEXT[sn.status]] : [],
        quote: sn.quote, comment: sn.comment, disposition: dispositionLine(sn),
        buttons: jumpButtons('saved', sn.key, sn.status),
      }));
    });
  }

  function findSaved(key) {
    for (var i = 0; i < savedNotes.length; i++) if (savedNotes[i].key === key) return savedNotes[i];
    return null;
  }

  function jumpTo(kind, key) {
    var marks = marksOf(kind, key);
    if (marks.length) {
      jumpHint.textContent = '';
      marks[0].scrollIntoView({ block: 'center' });
      marks.forEach(function (m) { m.classList.add('flash'); });
      setTimeout(function () { marks.forEach(function (m) { m.classList.remove('flash'); }); }, 1200);
      return;
    }
    // 没有高亮可去（图内划选、原文出现多处，或高亮已被拿掉）：滚到所在文档并提示。
    var note = kind === 'saved' ? findSaved(key) : findNote(key);
    if (!note) return;
    var body = docBodyByLabel(note.doc);
    if (body) body.parentNode.scrollIntoView({ block: 'start' });
    if (note.status === 'hl') {
      // 记着已高亮、mark 却不在了：改标「未在正文高亮」，重画后焦点放回这条的「定位」。
      note.status = 'unmarked';
      renderNotes();
      var item = noteItemOf(kind, key);
      var btn = item && item.querySelector('.jump-btn');
      if (btn) btn.focus();
    }
    jumpHint.textContent = '未在正文高亮';
  }

  function deleteNote(id) {
    unwrapMarks(id);
    state.notes = state.notes.filter(function (x) { return x.id !== id; });
    saveState();
    renderNotes();
    notesTitle.focus();
  }

  // 清空要点两次：第一次变成「再点一次确认」，4 秒内不点就还原。
  clearBtn.addEventListener('click', function () {
    if (clearBtn.dataset.armed === '1') {
      clearTimeout(clearTimer);
      state.notes.forEach(function (x) { unwrapMarks(x.id); });
      state.notes = [];
      saveState();
      renderNotes();
      notesTitle.focus();
      return;
    }
    clearBtn.dataset.armed = '1';
    clearBtn.textContent = '再点一次确认清空';
    clearTimer = setTimeout(function () { clearBtn.dataset.armed = ''; clearBtn.textContent = '清空'; }, 4000);
  });

  // ── 复制 ────────────────────────────────────────────────────────────────────
  var copyDlg = makeOverlay('sdflow-copy-dialog', '复制意见');
  var copyStatus = document.createElement('p');
  copyStatus.className = 'dlg-hint';
  copyStatus.id = 'sdflow-copy-status';
  copyStatus.setAttribute('role', 'status');
  var copyLabel = document.createElement('label');
  copyLabel.htmlFor = 'sdflow-copy-text';
  copyLabel.className = 'sr-only';
  copyLabel.textContent = '意见全文';
  var copyText = document.createElement('textarea');
  copyText.id = 'sdflow-copy-text';
  copyText.rows = 14;
  copyText.readOnly = true;
  var copyActions = document.createElement('div');
  copyActions.className = 'dlg-actions';
  var markBtn = makeButton('标记为已复制');
  markBtn.hidden = true;
  var copyClose = makeButton('关闭', 'primary');
  copyClose.id = 'sdflow-copy-close';
  copyActions.appendChild(markBtn);
  copyActions.appendChild(copyClose);
  [copyStatus, copyLabel, copyText, copyActions].forEach(function (el) { copyDlg.panel.appendChild(el); });

  function markCopied(ids) {
    state.notes.forEach(function (n) { if (ids.indexOf(n.id) >= 0) n.copied = true; });
    saveState();
    renderNotes();
  }

  // 依次试 Clipboard API、execCommand；resolve(true/false)，不抛错。
  function autoCopy(text) {
    return new Promise(function (resolve) {
      function legacy() {
        var ok = false;
        try { copyText.focus(); copyText.select(); ok = document.execCommand('copy'); } catch (e) { ok = false; }
        resolve(ok);
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { resolve(true); }, legacy);
          return;
        }
      } catch (e) { /* 落到 execCommand */ }
      legacy();
    });
  }

  function doCopy(all, opener) {
    var picked = view.map(function (v) { return v.note; })
      .filter(function (n) { return all || !n.copied; });
    if (!picked.length) return;
    var text = buildCopyText({
      title: document.title,
      pathname: location.pathname,
      copiedAt: formatLocalTime(new Date()),
      notes: picked.map(function (n) {
        var out = storable(n);
        out.path = pathOfDoc(n.doc);
        return out;
      }),
    });
    var ids = picked.map(function (n) { return n.id; });
    var myState = { ids: ids, returnFocus: opener };
    copyState = myState;
    copyText.value = text;
    copyStatus.textContent = '正在复制…';
    markBtn.hidden = true;
    copyDlg.overlay.hidden = false;
    copyText.focus();
    copyText.select();
    autoCopy(text).then(function (ok) {
      // 剪贴板已写入就标已复制，不论对话框此时是否还是本次那个
      if (ok) markCopied(ids);
      if (copyState !== myState) return;
      copyText.focus();
      copyText.select();
      if (ok) {
        copyStatus.textContent = '已复制 ' + ids.length + ' 条意见到剪贴板。若粘贴不出来，可在下面已全选的文本框里手动复制。';
      } else {
        copyStatus.textContent = '自动复制失败。下面的全文已全选，请按 Ctrl/⌘ + C 手动复制。';
        markBtn.hidden = false;
      }
    });
  }

  function closeCopy() {
    var c = copyState;
    if (!c) return;
    copyState = null;
    copyDlg.overlay.hidden = true;
    restoreFocus(c.returnFocus);
  }

  copyBtn.addEventListener('click', function () { doCopy(false, copyBtn); });
  copyAllBtn.addEventListener('click', function () { doCopy(true, copyAllBtn); });
  copyClose.addEventListener('click', closeCopy);
  markBtn.addEventListener('click', function () {
    if (copyState) markCopied(copyState.ids);
    markBtn.hidden = true;
    copyStatus.textContent = '已标记为已复制。';
  });

  drawRecordsSection();
  drawRevisionsSection();

  loadState();
  refreshView();
  restoreHighlights();
  drawNotes();
})();
</script>
</body>
</html>
